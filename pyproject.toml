[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldloom"
version = "0.0.1"
description = "Generate coherent synthetic enterprise worlds that materialise into realistic documents, business systems, and knowledge artifacts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0"]
arrow = ["pyarrow>=15.0"]
dev = ["pytest>=8.0"]

[project.scripts]
worldloom = "worldloom.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/worldloom"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "worldloom/_examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
