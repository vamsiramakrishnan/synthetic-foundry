[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldloom"
# Single-sourced from src/worldloom/__init__.py, so the version a corpus stamps
# into world.json and the version PyPI shows can never disagree.
dynamic = ["version"]
description = "Generate coherent synthetic enterprise worlds that materialise into realistic documents, business systems, and knowledge artifacts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "synthetic-data",
    "enterprise",
    "rag",
    "evaluation",
    "benchmark",
    "agents",
    "deterministic",
    "corpus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    # `worldloom.graphs` — the dependency, provenance, supersession and
    # reporting graphs, and the validator checks that read them. Core rather
    # than an extra because `worldloom validate` runs those checks on every
    # corpus, and a coherence gate that is skipped when an optional package is
    # missing is not a gate.
    "networkx>=3.2",
    # `worldloom.series` and `worldloom.similarity`. Both use numpy only for
    # elementwise and integer arithmetic, which is bit-identical everywhere;
    # neither performs a matrix product, which is the operation that would not
    # be. Pure-wheel, no compiler, no BLAS requirement at import.
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/vamsiramakrishnan/synthetic-foundry"
Documentation = "https://github.com/vamsiramakrishnan/synthetic-foundry/blob/main/docs/README.md"
Changelog = "https://github.com/vamsiramakrishnan/synthetic-foundry/blob/main/CHANGELOG.md"
Issues = "https://github.com/vamsiramakrishnan/synthetic-foundry/issues"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
docx = ["python-docx>=1.1"]
pdf = ["reportlab>=4.0"]
pptx = ["python-pptx>=1.0"]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0"]
arrow = ["pyarrow>=15.0"]
# `worldloom mcp` — the readings and gates as tools, spoken over stdio to an
# agent harness. An extra rather than a core dependency because every other
# command works without it: the same measurements are reachable through
# `worldloom diversity`, `topology`, `series` and `validate`, which need no
# protocol at all. No model-SDK extra exists: this package never calls a
# language model — the coding harness driving it is the writer.
mcp = ["mcp>=1.2"]
# Every renderer at once — the ordinary way to install the tool rather than
# the library. `pip install "worldloom[all]"`.
all = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "python-pptx>=1.0",
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0", "hypothesis>=6.100", "openpyxl>=3.1", "python-docx>=1.1",
    "reportlab>=4.0", "python-pptx>=1.0", "mcp>=1.2",
]

[project.scripts]
worldloom = "worldloom.cli:app"

[tool.hatch.version]
path = "src/worldloom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/worldloom"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "worldloom/_examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: a full multi-period, high-density build — the shape a large corpus actually is, not a fixture-sized stand-in for it. Excluded from the default run by `addopts` below; opt in with `pytest -m slow`.",
]
# `-m 'not slow'` is the opt-out, not the opt-in: `pytest -q` (the house
# gate in CLAUDE.md/AGENTS.md) must stay fast, so a test exercising a shape
# CI only needs occasionally is deselected here rather than skipped inside
# the test itself — a skip still pays the collection and fixture cost, a
# deselect does not.
addopts = "-m 'not slow'"
