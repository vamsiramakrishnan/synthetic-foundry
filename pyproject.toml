[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldloom"
# Single-sourced from src/worldloom/__init__.py, so the version a corpus stamps
# into world.json and the version PyPI shows can never disagree.
dynamic = ["version"]
description = "Generate coherent synthetic enterprise worlds that materialise into realistic documents, business systems, and knowledge artifacts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "synthetic-data",
    "enterprise",
    "rag",
    "evaluation",
    "benchmark",
    "agents",
    "deterministic",
    "corpus",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    # `worldloom.graphs` — the dependency, provenance, supersession and
    # reporting graphs, and the validator checks that read them. Core rather
    # than an extra because `worldloom validate` runs those checks on every
    # corpus, and a coherence gate that is skipped when an optional package is
    # missing is not a gate.
    "networkx>=3.2",
    # `worldloom.series` and `worldloom.similarity`. Both use numpy only for
    # elementwise and integer arithmetic, which is bit-identical everywhere;
    # neither performs a matrix product, which is the operation that would not
    # be. Pure-wheel, no compiler, no BLAS requirement at import.
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/vamsiramakrishnan/synthetic-foundry"
Documentation = "https://github.com/vamsiramakrishnan/synthetic-foundry/blob/main/docs/README.md"
Changelog = "https://github.com/vamsiramakrishnan/synthetic-foundry/blob/main/CHANGELOG.md"
Issues = "https://github.com/vamsiramakrishnan/synthetic-foundry/issues"

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
docx = ["python-docx>=1.1"]
pdf = ["reportlab>=4.0"]
pptx = ["python-pptx>=1.0"]
polars = ["polars>=0.20"]
pandas = ["pandas>=2.0"]
arrow = ["pyarrow>=15.0"]
# `worldloom mcp` — the readings and gates as tools, spoken over stdio to an
# agent harness. An extra rather than a core dependency because every other
# command works without it: the same measurements are reachable through
# `worldloom diversity`, `topology`, `series` and `validate`, which need no
# protocol at all. No model-SDK extra exists: this package never calls a
# language model — the coding harness driving it is the writer.
mcp = ["mcp>=1.2"]
# `worldloom evaluate --retriever embedding` — dense retrieval, so a hardness
# claim rests on something other than 1990s lexical matching. An extra, and
# emphatically not a core dependency, for two reasons. It is the only thing in
# this project that downloads weights over a network, and a corpus that cannot
# be scored offline is not reproducible. And it is not needed to *replay* a
# measurement: vectors are cached content-addressed against a pinned model id
# and revision, so a corpus carrying its cache scores against the embedding
# retriever with none of this installed — see `src/worldloom/evaluate/embedding.py`
# for the argument in full. Absent, the retriever skips with a message.
#
# model2vec is the default pin's backend: static embeddings, so inference is a
# token lookup and a mean pool — numpy and a tokenizer, no torch. The
# transformer cross-check (`embedding.MINILM`) needs sentence-transformers,
# deliberately left out of every extra here: half a gigabyte of torch is a
# choice a user should make explicitly, and the finding it produces is a
# cross-check on the default rather than the default itself.
embeddings = ["model2vec>=0.6", "huggingface-hub>=0.24"]
# Every renderer at once — the ordinary way to install the tool rather than
# the library. `pip install "worldloom[all]"`.
all = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "python-pptx>=1.0",
    "mcp>=1.2",
]
dev = [
    "pytest>=8.0", "openpyxl>=3.1", "python-docx>=1.1", "reportlab>=4.0",
    "python-pptx>=1.0", "mcp>=1.2",
    # `tests/test_properties.py`. Dev-only and never imported from `src/`: the
    # rest of this project's determinism rests on nothing under `src/` drawing
    # randomness, and Hypothesis draws plenty — seeded, test-side, and
    # reproducible from its own database, which `.gitignore` keeps out of the
    # repo so CI derives counterexamples rather than replaying a cached file.
    "hypothesis>=6.100",
]

[project.scripts]
worldloom = "worldloom.cli:app"

[tool.hatch.version]
path = "src/worldloom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/worldloom"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "worldloom/_examples"

# Lint gate. CI runs `ruff check` blocking — a linter that only warns is a
# gate that is skipped, and this repository's own line on that is that a
# skipped gate is not a gate. Target version is inferred from
# `requires-python` above, so the two can never disagree.
[tool.ruff]
extend-exclude = ["dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes — undefined names, unused imports/variables
    "I",   # import sorting
    "B",   # bugbear — mutable defaults, useless expressions, footguns
    "UP",  # pyupgrade — idioms the floor (3.11) already supports
    "RUF", # ruff's own checks — noqa hygiene, ambiguous defaults
]
ignore = [
    # The house style is long-form why-comments — arguments, not annotations
    # (measured p99 line length 96, max 253). A width gate would force
    # reflowing prose whose paragraphing is deliberate, and the loss of a
    # readable argument outweighs the gain of a uniform right margin.
    "E501",
    # A late import here is the registration seam, not an accident:
    # `retail.py` registers its physics *after* defining what they attach to,
    # with the reason documented in place ("a span that appeared only when
    # some module happened to have been imported would make a corpus's
    # figures depend on import order"). The same pattern closes
    # `banking_documents.py`, `documents.py`, `episodes.py`, `lob.py` and
    # `procurement.py`. E402 cannot tell that seam from a mistake.
    "E402",
    # 102 `zip()` call sites predate this rule. Retrofitting `strict=True`
    # wholesale changes runtime behaviour on any path where lengths can
    # legitimately differ — a semantic change the suite does not prove safe —
    # and `strict=False` everywhere restates the default 102 times. Left as a
    # ratchet: new code should say `strict=`, and removing this ignore once
    # the sites are audited is the follow-up.
    "B905",
    # The prose in comments and docstrings deliberately uses typographic
    # characters — the multiplication sign in "×6", en dashes, curly quotes.
    # These rules exist to catch homoglyph confusion in identifiers, and here
    # they would fire on writing that is correct as written.
    "RUF001", "RUF002", "RUF003",
    # `path + (start,)` is the house spelling for extending an immutable
    # path (axes, columns, docs all use it). Iterable unpacking spells the
    # same value with no behavioural difference; churning 22 dense
    # expressions for spelling is a loss.
    "RUF005",
    # `__all__` lists here are grouped semantically with section comments —
    # `__init__.py`'s reads "# entry points / # entities / # lore /
    # # simulation". Alphabetising would destroy a deliberate taxonomy.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# Typer's API *is* function calls in argument defaults: `typer.Option(...)`
# is read at decoration time to build the CLI. Moving the calls into the
# function body is how typer is not used.
"src/worldloom/cli.py" = ["B008"]

# Type gate. This package ships `py.typed`, and a typed public surface nobody
# checks is an advisory type system — by this repository's own principle, not
# a gate. CI runs `mypy` blocking on this config.
#
# The honest scope, measured 2026-08 (mypy 2.3.1): 254 errors across 59 of
# 163 modules at this config's strictness, 520 at `--strict`. The 59 are
# listed below with `ignore_errors` — that list IS the debt ledger, and the
# ratchet is: fix a module, delete its line, and the gate holds it clean from
# then on. Everything not listed — including the thin waist (`models`,
# `world`, `recipe`, `validate`, `factkinds`, `corpus`, `rng`, `ids`, `sdk`,
# the narrative contract) — is checked and blocking today, and
# a *new* module is blocking by default, so the debt list can only shrink.
[tool.mypy]
files = ["src/worldloom"]
python_version = "3.11"
# Notes would drown the errors at this scale; the gate is pass/fail.
pretty = false

# Third-party packages that ship no stubs (and the optional extras, which CI
# legs may not have installed at all). Named individually rather than a global
# ignore_missing_imports, so a typo'd first-party import still fails.
[[tool.mypy.overrides]]
module = [
    "anyio.*",
    "docx.*",
    "huggingface_hub.*",
    "lxml.*",
    "mcp.*",
    "model2vec.*",
    "networkx.*",
    "openpyxl.*",
    "pptx.*",
    "reportlab.*",
    "sentence_transformers.*",
    "transformers.*",
]
ignore_missing_imports = true

# The measured debt, module by module. Each line is a module with known
# errors that predate the gate; the gate still *parses* them (an import error
# or syntax error here fails the run) but does not hold them to the standard
# yet. Do not add to this list to make a red run green — fix the module or
# leave your new module off it, where it is checked.
[[tool.mypy.overrides]]
module = [
    "worldloom.actors.runtime",
    "worldloom.banking",
    "worldloom.banking_scenarios",
    "worldloom.benchmark",
    "worldloom.cli",
    "worldloom.cohorts",
    "worldloom.collections",
    "worldloom.compiler.diversity",
    "worldloom.compose",
    "worldloom.covering",
    "worldloom.detail",
    "worldloom.documents",
    "worldloom.episodes",
    "worldloom.facets",
    "worldloom.generators.banking_org",
    "worldloom.generators.cases",
    "worldloom.generators.distractors",
    "worldloom.generators.estate",
    "worldloom.generators.evaluation",
    "worldloom.generators.hierarchy",
    "worldloom.generators.insurance_book",
    "worldloom.generators.insurance_evaluation",
    "worldloom.generators.insurance_org",
    "worldloom.generators.operations",
    "worldloom.generators.org_builder",
    "worldloom.generators.organisation",
    "worldloom.generators.planning",
    "worldloom.generators.procurement_cycle",
    "worldloom.generators.procurement_evaluation",
    "worldloom.generators.procurement_org",
    "worldloom.graphs",
    "worldloom.insurance",
    "worldloom.insurance_documents",
    "worldloom.insurance_scenarios",
    "worldloom.lob",
    "worldloom.locales",
    "worldloom.mcp",
    "worldloom.mosaic",
    "worldloom.narrative.compiler",
    "worldloom.pack_export",
    "worldloom.packs",
    "worldloom.policies",
    "worldloom.presentation",
    "worldloom.procurement",
    "worldloom.procurement_documents",
    "worldloom.procurement_scenarios",
    "worldloom.registries",
    "worldloom.render.bundles",
    "worldloom.render.docx",
    "worldloom.render.html",
    "worldloom.render.markdown",
    "worldloom.render.pptx",
    "worldloom.render.xlsx",
    "worldloom.scenarios",
    "worldloom.stats",
    "worldloom.structure",
    "worldloom.timeline",
    "worldloom.workforce",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: a full multi-period, high-density build — the shape a large corpus actually is, not a fixture-sized stand-in for it. Excluded from the default run by `addopts` below; opt in with `pytest -m slow`.",
]
# `-m 'not slow'` is the opt-out, not the opt-in: `pytest -q` (the house
# gate in CLAUDE.md/AGENTS.md) must stay fast, so a test exercising a shape
# CI only needs occasionally is deselected here rather than skipped inside
# the test itself — a skip still pays the collection and fixture cost, a
# deselect does not.
addopts = "-m 'not slow'"
