name: source-only artifact ecology lint fix
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-source-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - name: Fix source and push
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worldloom/artifact_ecology.py')
          text = p.read_text()
          text = text.replace(
              '            if status != "To Do": history.append({"from": "To Do", "to": "In Progress", "sequence": 1})\n',
              '            if status != "To Do":\n                history.append({"from": "To Do", "to": "In Progress", "sequence": 1})\n',
          ).replace(
              '            if status == "Done": history.append({"from": "In Progress", "to": "Done", "sequence": 2})\n',
              '            if status == "Done":\n                history.append({"from": "In Progress", "to": "Done", "sequence": 2})\n',
          )
          p.write_text(text)
          PY
          git config user.name 'worldloom-artifact-realism-bot'
          git config user.email 'worldloom-artifact-realism-bot@users.noreply.github.com'
          git add src/worldloom/artifact_ecology.py
          git diff --cached --check
          git commit -m 'Fix Jira lifecycle formatting in artifact ecology'
          git push origin HEAD:codex/worldloom-artifact-realism
