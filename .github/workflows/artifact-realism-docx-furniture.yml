name: add Word genre furniture
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-docx-furniture.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add minimal genre-native front matter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worldloom/render/docx.py')
          text = path.read_text()
          marker = '\n\ndef _contents(document, ir: ArtifactIR, g: StyleGenome) -> None:  # type: ignore[no-untyped-def]\n'
          helper = r'''


def _genre_front_matter(document, ir: ArtifactIR, g: StyleGenome) -> None:  # type: ignore[no-untyped-def]
    """Small native control block for genres that conventionally have one.

    Every value already exists on the IR. Missing values are omitted rather
    than invented; the body and artifact grammar remain untouched.
    """
    if ir.metadata.get("realism_profile") != "ecology/v1":
        return
    genre = ir.metadata.get("artifact_genre")
    if genre not in {"decision_memo", "controlled_document", "incident_rca"}:
        return

    from datetime import datetime
    from docx.shared import Pt

    created = ir.metadata.get("worldloom_created")
    date = ""
    if created:
        date = datetime.fromisoformat(created).strftime("%d %b %Y")

    if genre == "decision_memo":
        rows = (
            ("From", ir.metadata.get("author", "")),
            ("Date", date),
            ("Subject", ir.title),
        )
    else:
        rows = (
            ("Status", ir.metadata.get("lifecycle", "").replace("_", " ").title()),
            ("Revision", ir.metadata.get("revision", "")),
            ("Date", date),
        )
    rows = tuple((label, value) for label, value in rows if value)
    if not rows:
        return

    table = document.add_table(rows=0, cols=2)
    _apply_table_borders(table, "horizontal", g.rule_weight)
    _apply_cell_padding(table, _cell_padding_pt(g))
    for label, value in rows:
        cells = table.add_row().cells
        cells[0].text = label
        cells[1].text = value
        for run in cells[0].paragraphs[0].runs:
            run.bold = True
        for cell in cells:
            for paragraph in cell.paragraphs:
                for run in paragraph.runs:
                    run.font.size = Pt(_heading_pt(g, _TS_BODY))
                    run.font.color.rgb = _rgb(g.colour_roles["body_text"])
'''
          if marker not in text:
              raise SystemExit('DOCX contents seam changed')
          text = text.replace(marker, helper + marker, 1)
          old = '    _cover(document, ir, g)\n    _contents(document, ir, g)\n'
          new = '    _cover(document, ir, g)\n    _genre_front_matter(document, ir, g)\n    _contents(document, ir, g)\n'
          if old not in text:
              raise SystemExit('DOCX render seam changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: |
          python -m pip install -e '.[dev,docx]' ruff==0.15.8
          ruff check --fix src/worldloom/render/docx.py
          ruff check src/worldloom/render/docx.py tests/test_docx_genre_furniture.py
          pytest -q tests/test_docx_genre_furniture.py tests/test_docx.py
      - name: Commit renderer only
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/render/docx.py
          git commit -m 'Add native front matter to enterprise documents'
          git push origin HEAD:codex/worldloom-artifact-realism
