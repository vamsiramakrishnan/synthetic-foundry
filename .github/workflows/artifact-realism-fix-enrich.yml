name: fix ecology enrichment copy
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-fix-enrich.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Use the immutable World dataclass copy seam
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worldloom/artifact_ecology.py')
          text = path.read_text()
          old = '''    recipe = dict(staged.recipe)\n    recipe["artifact_realism"] = "ecology/v1"\n    return staged.extend(artifact_irs=irs, recipe=recipe)\n'''
          new = '''    recipe = dict(staged.recipe)\n    recipe["artifact_realism"] = "ecology/v1"\n    from dataclasses import replace\n\n    return replace(staged, _artifact_irs=irs, _recipe=recipe)\n'''
          if old not in text:
              raise SystemExit('enrich_world seam changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: |
          python -m pip install -e '.[dev]' ruff==0.15.8
          ruff check src/worldloom/artifact_ecology.py tests/test_ecology_sdk.py
          pytest -q tests/test_ecology_sdk.py
      - name: Commit only the enrichment fix
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/artifact_ecology.py
          git commit -m 'Fix immutable artifact ecology enrichment'
          git push origin HEAD:codex/worldloom-artifact-realism
