name: contract source snapshot
on:
  push:
    branches: [codex/worldloom-close-open-contracts]
    paths: [.github/workflows/contract-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/contract-snapshot
          git archive --format=tar.gz HEAD > /tmp/contract-snapshot/source.tar.gz
          git rev-parse HEAD > /tmp/contract-snapshot/commit.txt
          sha256sum /tmp/contract-snapshot/source.tar.gz > /tmp/contract-snapshot/sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: contract-source
          path: /tmp/contract-snapshot
          retention-days: 3
