name: process catalogue check
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths:
      - .github/workflows/process-catalogue-check.yml
      - src/worldloom/process_catalogue.py
      - src/worldloom/_data/process-catalogue/**
      - tests/test_process_catalogue.py
      - tools/compile_processes.py
      - tools/finalize_process_catalogue.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Finalize package data wiring
        run: python tools/finalize_process_catalogue.py
      - name: Install focused test dependencies
        run: python -m pip install -e '.[dev]' ruff==0.15.8
      - name: Canonicalize generated runtime module
        run: ruff check --fix src/worldloom/process_catalogue.py
      - name: Lint process catalogue integration
        run: ruff check src/worldloom/process_catalogue.py tests/test_process_catalogue.py tools/compile_processes.py tools/finalize_process_catalogue.py
      - name: Test process catalogue invariants
        run: pytest -q tests/test_process_catalogue.py
      - name: Verify supplied 12-industry oracle
        run: python tools/compile_processes.py --verify
      - name: Commit finalized runtime wiring
        run: |
          if git diff --quiet -- src/worldloom/process_catalogue.py; then
            echo 'Runtime wiring already finalized.'
            exit 0
          fi
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/process_catalogue.py
          git commit -m 'Finalize packaged process catalogue runtime'
          git push origin HEAD:codex/worldloom-artifact-realism
      - name: Capture exact source for offline reproducibility
        run: |
          mkdir -p /tmp/worldloom-source
          git archive --format=tar.gz HEAD > /tmp/worldloom-source/source.tar.gz
          git rev-parse HEAD > /tmp/worldloom-source/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: process-catalogue-source
          path: /tmp/worldloom-source/
          retention-days: 7
          if-no-files-found: error
