name: operational-synthesis review tooling
on:
  push:
    branches: [codex/worldloom-operational-synthesis]
    paths: [.github/workflows/worldloom-review-tools.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download the repository's pinned gates for offline review
        run: |
          python -m pip download --only-binary=:all: --dest wheels ruff==0.15.8 mypy==2.3.1 hypothesis
      - uses: actions/upload-artifact@v7
        with:
          name: worldloom-review-tools
          path: wheels/
          retention-days: 3
