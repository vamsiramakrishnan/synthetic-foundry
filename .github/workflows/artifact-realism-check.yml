name: artifact realism check
on:
  push:
    branches: [codex/worldloom-artifact-realism]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' ruff==0.15.8 mypy==2.3.1
      - run: ruff check src/worldloom/artifact_realism.py src/worldloom/artifact_ecology.py src/worldloom/connector_realism.py src/worldloom/ecology.py src/worldloom/realism.py src/worldloom/storyboard.py src/worldloom/eval_design.py src/worldloom/eval_candidates.py src/worldloom/eval_instances.py src/worldloom/evals.py tests/test_artifact_realism.py tests/test_ecology_sdk.py tests/test_storyboard.py tests/test_eval_design.py tests/test_eval_candidates.py tests/test_eval_instances.py tests/test_eval_campaign.py
      - run: mypy src/worldloom/artifact_realism.py src/worldloom/connector_realism.py src/worldloom/ecology.py src/worldloom/realism.py src/worldloom/storyboard.py src/worldloom/eval_design.py src/worldloom/eval_candidates.py src/worldloom/eval_instances.py src/worldloom/evals.py
      - run: pytest -q tests/test_artifact_realism.py tests/test_ecology_sdk.py tests/test_storyboard.py tests/test_eval_design.py tests/test_eval_candidates.py tests/test_eval_instances.py tests/test_eval_campaign.py
