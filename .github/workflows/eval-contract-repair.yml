# one-shot repair gate; deletes itself after verified commits
name: repair eval-first replay contracts
on:
  push:
    branches: [codex/structural-uplift]
    paths:
      - .github/workflows/eval-contract-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/structural-uplift
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Repair abstract operation and revision replay contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one match, found {count}: {old!r}"
              p.write_text(text.replace(old, new, 1))

          # Eval-first design may know the operation before a product surface is
          # selected. Entity is connector vocabulary; operation is not.
          replace_once(
              'src/worldloom/eval_design.py',
              '''        if self.operation is not None and self.connector is None:
              raise ValueError(f"{self.id}: operation needs connector")
          ''',
              '',
          )

          # Construction records its tactic during ordinary generation, but replay
          # re-applies the recorded tactic without appending the same recipe step.
          replace_once(
              'src/worldloom/eval_construction.py',
              'def apply_revision_family(world: World, proposal: TacticProposal) -> World:\n',
              'def apply_revision_family(\n    world: World, proposal: TacticProposal, *, record_recipe: bool = True\n) -> World:\n',
          )
          replace_once(
              'src/worldloom/eval_construction.py',
              '''    recipe = with_step(world.recipe, "EvalRevisionFamily", proposal=proposal.model_dump(mode="json"))
              applied = set(recipe.get("eval_tactics", []))
          ''',
              '''    recipe = (
                  with_step(
                      world.recipe,
                      "EvalRevisionFamily",
                      proposal=proposal.model_dump(mode="json"),
                  )
                  if record_recipe
                  else dict(world.recipe)
              )
              applied = set(recipe.get("eval_tactics", []))
          ''',
          )

          recipe = Path('src/worldloom/recipe.py')
          text = recipe.read_text()

          step_line = '    "AddIrrelevantFacts": ("seed", "count"),\n'
          assert text.count(step_line) == 1
          text = text.replace(
              step_line,
              step_line + '    "EvalRevisionFamily": ("proposal",),\n',
              1,
          )

          registry_fallback = '        elif name in _STEP_REGISTRY:\n'
          assert text.count(registry_fallback) == 1
          replay_branch = '''        elif name == "EvalRevisionFamily":
              from .eval_construction import apply_revision_family
              from .eval_tactics import TacticProposal

              world = apply_revision_family(
                  world,
                  TacticProposal.model_validate(step["proposal"]),
                  record_recipe=False,
              )
          '''
          text = text.replace(
              registry_fallback,
              replay_branch + registry_fallback,
              1,
          )
          recipe.write_text(text)
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]' ruff==0.15.8 mypy==2.3.1
      - name: Validate repaired contracts
        run: |
          ruff check
          mypy
          pytest -q \
            tests/test_eval_design.py \
            tests/test_eval_reference.py \
            tests/test_eval_construction.py \
            tests/test_recipe.py
      - name: Commit repairs separately
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/eval_design.py
          git commit -m 'Allow abstract eval operations before connector binding'
          git add src/worldloom/eval_construction.py src/worldloom/recipe.py
          git commit -m 'Make revision-family construction replayable'
          git rm .github/workflows/eval-contract-repair.yml
          git commit -m 'Remove completed eval contract repair gate'
          git push origin HEAD:codex/structural-uplift
