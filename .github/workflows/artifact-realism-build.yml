name: artifact realism engineering
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]'
      - name: Build artifact realism layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/task.md')
          p.write_text('''You are the implementation engineer for Worldloom. Inspect AGENTS.md and the repository before editing. Implement a substantial artifact-realism architecture, not cosmetic template proliferation. Work only in this checkout.\n\nGoal: make generated enterprise artifacts look and behave like outputs from a real company across PPTX, DOCX/PDF/Markdown, XLSX, ServiceNow, Confluence, Jira and email. Preserve deterministic replay and factual coherence.\n\nRequired architecture:\n1. Add an artifact-realism/style-policy layer above renderers: deterministic latent organisation style DNA (brand/design system, density, voice, author/team habits, template family, lifecycle state) selected from seed/archetype/department/artifact. It must create correlated style across artifacts without making every artifact identical.\n2. Add artifact lifecycle/provenance: draft/review/published/superseded, authors/approvers, timestamps derived from world timeline (never wall clock), revision chains and cross-artifact references. Where existing models cannot hold this cleanly, add frozen typed models rather than dict soup.\n3. PPTX: multiple deterministic layout families and slide grammars (title, section, KPI, table, chart, comparison, decision, timeline, appendix), variable deck length/density, coherent masters/theme, footer/page metadata, charts/tables driven by facts, realistic whitespace. Avoid random decoration.\n4. DOCX/PDF/Markdown: document genres with distinct information architecture (memo, operating review, policy, incident RCA, board/executive brief, SOP), cover/header/footer, revision metadata, TOC/sections/tables/callouts where appropriate. Same facts can be voiced differently by audience.\n5. XLSX: workbook schemas that behave like analyst workbooks: multiple related sheets, formulas where derivable, number/date formats, frozen panes, filters, widths, hidden/helper/reference sheets where justified, source/detail -> summary linkage, reconciliation checks. Formula results must reconcile to generated facts; never invent independent numbers.\n6. ServiceNow/Jira: real lifecycle histories rather than flat records: state transitions, assignment groups, comments/work notes, related incidents/problems/changes, SLAs, priority/severity, timestamps, affected service/CI, actor provenance. Respect product differences; do not make ServiceNow a Jira skin.\n7. Confluence: page trees/spaces, ancestors, labels, owners, versions, backlinks/mentions, macros/table/task/status structures and links to tickets/docs where evidence exists.\n8. Email: threads, participants/To/Cc, reply/forward semantics, quoted history or reply references, subject evolution, attachments/links, realistic time ordering, actor voice variation, escalation and resolution chains. Avoid every message being a polished memo.\n9. Cross-surface graph: one business episode should leave different evidence on different systems, with stable IDs and temporal causality. Do not clone identical prose across surfaces.\n10. Evaluation: add measurable realism/coherence gates: structural diversity, cross-artifact consistency, template repetition, metadata/lifecycle validity, graph connectivity, spreadsheet formula/reconciliation integrity, thread/ticket chronology. Add deterministic quality-diversity/evolution search over safe style parameters if it improves measured coverage. Never let a model or candidate weaken validators.\n11. Harness: add/update a skill that lets Claude/Codex-style writer/reviewer harnesses propose bounded prose/layout plans. Host validators remain authoritative; all model outputs ledgered/replayable. No model required for ordinary deterministic generation.\n12. Tests: strong regression/property tests for deterministic bytes, hash-seed independence, lifecycle chronology, cross-surface IDs, workbook formulas, style-family variation across seeds while same seed is stable, and no bare invented numeric claims.\n13. Docs: explain architecture, SDK/CLI usage, limitations and how to add a new artifact family. Update generated command docs if CLI changes.\n\nDo not weaken existing tests. Do not edit golden fixtures merely to pass validators. Keep the operational-synthesis changes already on this branch. Prefer a few composable primitives over hundreds of templates. Run focused tests, ruff and mypy. Commit all changes to codex/worldloom-artifact-realism and push. Do not merge PRs.''')
          PY
          if command -v codex >/dev/null 2>&1; then
            codex exec --full-auto "$(cat /tmp/task.md)"
          elif command -v claude >/dev/null 2>&1; then
            claude -p --dangerously-skip-permissions "$(cat /tmp/task.md)"
          else
            echo 'No coding harness installed on runner' >&2
            exit 2
          fi
      - name: Verify and push
        run: |
          ruff check .
          mypy
          pytest -q tests/test_render.py tests/test_harness_docs.py || exit 1
          git status --short
          git push origin HEAD:codex/worldloom-artifact-realism
