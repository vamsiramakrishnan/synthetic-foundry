name: process bindings check
on:
  pull_request:
    paths:
      - .github/workflows/process-bindings-check.yml
      - src/worldloom/process_bindings/**
      - src/worldloom/process_catalogue.py
      - src/worldloom/process_planning/**
      - src/worldloom/process.py
      - src/worldloom/predicates.py
      - src/worldloom/artifact_ecology.py
      - src/worldloom/_data/process-catalogue/**
      - tests/test_process*.py
      - tests/test_predicates.py
      - tests/test_ecology_sdk.py
      - tools/compile_process_bindings.py
  push:
    branches: [main, codex/worldloom-artifact-realism]
    paths:
      - .github/workflows/process-bindings-check.yml
      - src/worldloom/process_bindings/**
      - src/worldloom/process_catalogue.py
      - src/worldloom/process_planning/**
      - src/worldloom/process.py
      - src/worldloom/predicates.py
      - src/worldloom/artifact_ecology.py
      - src/worldloom/_data/process-catalogue/**
      - tests/test_process*.py
      - tests/test_predicates.py
      - tests/test_ecology_sdk.py
      - tools/compile_process_bindings.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install checks
        run: python -m pip install -e '.[dev]' ruff==0.15.8 mypy==2.3.1
      - name: Lint and type check
        run: |
          ruff check src/worldloom/process_bindings src/worldloom/predicates.py src/worldloom/artifact_ecology.py tools/compile_process_bindings.py tests/test_process_bindings.py
          mypy src/worldloom/process_bindings src/worldloom/predicates.py src/worldloom/artifact_ecology.py
      - name: Source parity, adapters, evidence and compatibility tests
        run: python -m pytest -q tests/test_process_bindings.py tests/test_lexicon.py tests/test_predicates.py tests/test_tool_surface.py tests/test_process.py tests/test_ecology_sdk.py tests/test_determinism_hygiene.py tests/test_process_catalogue.py tests/test_process_planning.py
      - name: Recompile all twelve industries twice
        run: |
          python -m worldloom.process_bindings --all --out /tmp/processes-one
          python -m worldloom.process_bindings --all --out /tmp/processes-two
          diff -r /tmp/processes-one /tmp/processes-two
          python - <<'PY'
          from pathlib import Path
          from worldloom.process_bindings import baseline_parity, verify_export
          plans = [verify_export(p) for p in sorted(Path('/tmp/processes-one').glob('company-*'))]
          assert len(plans) == 12
          assert sum(len(p.rows) for p in plans) == 6975
          assert all(baseline_parity(p) for p in plans)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: process-bindings-audit
          path: /tmp/processes-one/
          retention-days: 7
          if-no-files-found: error
