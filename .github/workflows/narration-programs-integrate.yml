name: verify program narration
on:
  push:
    branches: [codex/worldloom-close-open-contracts]
    paths: [.github/workflows/narration-programs-integrate.yml]
permissions:
  contents: write
concurrency:
  group: close-unfinished-narration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Connect recipe replay and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worldloom/recipe.py')
          text = p.read_text()
          old = '    "Compose": ("ledger_key",),'
          assert text.count(old) == 1
          text = text.replace(old, old + '\n    "NarrationPrograms": ("keys",),')
          old = '        elif name in _STEP_REGISTRY:'
          assert text.count(old) == 1
          text = text.replace(old, '        elif name == "NarrationPrograms":\n            from .narrative import programs\n\n            world = programs.replay(world, keys=step["keys"], ledger=ledger)\n' + old)
          p.write_text(text)
          p = Path('docs/README.md')
          p.write_text(p.read_text() + '\n\n## Reusable narration\n\n[Narration programs](narration-programs.md) covers family-level authoring, bounded fact substitution, dependency caches, measured diversity, blind reader checks and offline replay.\n')
          p = Path('CHANGELOG.md')
          text = p.read_text()
          assert '## Unreleased\n' in text
          p.write_text(text.replace('## Unreleased\n', '## Unreleased\n\n### Generation — reusable narration programs\n\n- Add opt-in family-level prose authoring and deterministic clause expansion. Existing per-instance narration remains unchanged.\n- Persist program sources and clause dependencies in the normal ledger and restore them during recipe replay. Bound-fact changes invalidate only dependent expansions.\n- Enforce measured near-duplicate budgets and optional blind-reader findings through existing claim validation. Expansion and replay make no model calls.\n', 1))
          PY
      - name: Install verification dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]' ruff==0.15.8 mypy==2.3.1
      - name: Static gates
        run: |
          ruff check --fix src/worldloom/narrative/programs.py src/worldloom/narrative/reader_checks.py tests/test_narrative_programs.py
          ruff check
          mypy
      - name: Program, reader and replay regressions
        run: pytest -q tests/test_narrative_programs.py tests/test_narrative.py tests/test_narration_reference.py tests/test_similarity.py tests/test_temporal_contract.py
      - name: Full suite and compatibility gates
        run: |
          pytest -q
          worldloom docs --check
          worldloom validate retail-close
      - name: Commit verified integration and remove the one-time workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/codex/worldloom-close-open-contracts | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name worldloom-contracts-bot
          git config user.email actions@users.noreply.github.com
          git add src/worldloom/recipe.py src/worldloom/narrative/programs.py src/worldloom/narrative/reader_checks.py tests/test_narrative_programs.py docs/README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'Preserve program sources and clause dependencies in byte-identical replay'
          git rm .github/workflows/narration-programs-integrate.yml
          git commit -m 'Remove verified narration integration workflow'
          git push origin HEAD:codex/worldloom-close-open-contracts
