name: integrate artifact ecology
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Wire ecology into existing contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          edit('src/worldloom/connector_data.py', '''    records = [
                  record
                  for connector in connectors
                  for record in projections.project(connector, world)
              ]
          ''', '''    records = [
                  record
                  for connector in connectors
                  for record in projections.project(connector, world)
              ]
              from .artifact_ecology import enrich_connector_records
              records = enrich_connector_records(world, records)
          ''')

          edit('src/worldloom/world.py', '''    def render(self, *formats: str) -> World:
          ''', '''    def realize_artifacts(self) -> World:
                  """Apply deterministic organisation DNA, lifecycle, and surface policy.

                  Facts, resolved values, formulas, and evidence references are unchanged.
                  The operation is opt-in and idempotent.
                  """
                  from .artifact_ecology import enrich_world
                  return enrich_world(self)

              def render(self, *formats: str) -> World:
          ''')

          for path in ('src/worldloom/render/docx.py', 'src/worldloom/render/pptx.py'):
              edit(path, '''    raw = ir.metadata.get("worldloom_seed")
              seed = int(raw) if raw and raw != "None" else 0
              return genome(Rng(seed).derive("style"))
          ''', '''    raw = ir.metadata.get("style_seed") or ir.metadata.get("worldloom_seed")
              seed = int(raw) if raw and raw != "None" else 0
              archetype = ir.metadata.get("style_archetype")
              allowed = {"house", "finance_compact", "editorial_neutral", "executive_sparse", "operating_review", "technical_architecture"}
              if archetype in allowed:
                  return genome(Rng(seed).derive("style"), archetype=archetype)  # type: ignore[arg-type]
              return genome(Rng(seed).derive("style"))
          ''')

          edit('src/worldloom/render/docx.py', '''    foot.text = ""
              label = foot.add_run(
                  ir.metadata.get("note", "Synthetic corpus generated by Worldloom.") + "    Page "
              )
          ''', '''    foot.text = ""
              control = ""
              if ir.metadata.get("realism_profile"):
                  control = f" · {ir.metadata.get('lifecycle', 'draft').upper()} · Rev {ir.metadata.get('revision', '1')}"
              label = foot.add_run(
                  ir.metadata.get("note", "Synthetic corpus generated by Worldloom.") + control + "    Page "
              )
          ''')
          edit('src/worldloom/render/docx.py', '''    properties.keywords = "synthetic,worldloom,seed=" + ir.metadata.get("worldloom_seed", "")
          ''', '''    properties.keywords = "synthetic,worldloom,seed=" + ir.metadata.get("worldloom_seed", "")
              if ir.metadata.get("realism_profile"):
                  properties.category = f"{ir.metadata.get('artifact_family', '')}; {ir.metadata.get('lifecycle', '')}; rev={ir.metadata.get('revision', '1')}"
          ''')

          edit('src/worldloom/render/pptx.py', '''    plan = plan_from_ir(
                  ir,
                  artifact_type="executive_summary",
                  size_class=_SIZE_CLASS,
                  density_profile=_DENSITY_PROFILE,
              )
          ''', '''    density = {"airy": "sparse", "balanced": "balanced", "compact": "dense"}.get(
                  ir.metadata.get("artifact_density", "balanced"), _DENSITY_PROFILE
              )
              plan = plan_from_ir(
                  ir,
                  artifact_type="executive_summary",
                  size_class=_SIZE_CLASS,
                  density_profile=density,  # type: ignore[arg-type]
              )
          ''')
          p = Path('src/worldloom/render/pptx.py')
          text = p.read_text()
          needle = '''    footer_text = f"{plan.metadata.get('company', '')} · {plan.title}"\n'''
          replacement = needle + '''    if plan.metadata.get("realism_profile"):\n        footer_text += f" · {plan.metadata.get('lifecycle', 'draft').upper()} · Rev {plan.metadata.get('revision', '1')}"\n'''
          if 'Rev {plan.metadata.get' not in text:
              if text.count(needle) < 2:
                  raise SystemExit('pptx footer anchors missing')
              text = text.replace(needle, replacement)
              p.write_text(text)
          edit('src/worldloom/render/pptx.py', '''    properties.keywords = "synthetic,worldloom,seed=" + ir.metadata.get("worldloom_seed", "")
          ''', '''    properties.keywords = "synthetic,worldloom,seed=" + ir.metadata.get("worldloom_seed", "")
              if ir.metadata.get("realism_profile"):
                  properties.category = f"{ir.metadata.get('artifact_family', '')}; {ir.metadata.get('lifecycle', '')}; rev={ir.metadata.get('revision', '1')}"
          ''')

          edit('src/worldloom/render/xlsx.py', '''        sheet.freeze_panes = sheet.cell(row=rows_of[table.key], column=2)
          ''', '''        sheet.freeze_panes = sheet.cell(row=rows_of[table.key], column=2)
                  if ir.metadata.get("realism_profile"):
                      last_row = rows_of[table.key] + max(0, len(table.rows) - 1)
                      last_col = _column_letter(len(table.columns) + 1)
                      sheet.auto_filter.ref = f"A{_HEADER_ROW}:{last_col}{last_row}"
                      sheet.sheet_view.showGridLines = g.gridline_policy == "all"
          ''')
          edit('src/worldloom/render/xlsx.py', '''    workbook.properties.title = ir.title
          ''', '''    if ir.metadata.get("realism_profile"):
                  control = workbook.create_sheet(title="_DocumentControl")
                  control.sheet_state = "hidden"
                  control.append(["field", "value"])
                  for key in ("realism_profile", "artifact_family", "artifact_density", "artifact_voice", "lifecycle", "revision", "department_style"):
                      control.append([key, ir.metadata.get(key, "")])
                  control.append(["reconciliation", "All formulas derive from ArtifactIR cells/facts"])

              workbook.properties.title = ir.title
          ''')

          edit('src/worldloom/render/bundles.py', '''        "work_notes": work_notes,
          ''', '''        "work_notes": work_notes,
                  "state_history": [
                      {"state": "New", "sequence": 0, "at": opened.valid_from.isoformat() if opened else None},
                      {"state": "In Progress", "sequence": 1, "at": opened.valid_from.isoformat() if opened else None},
                      *([{"state": "Resolved", "sequence": 2, "at": resolved.valid_from.isoformat()}] if resolved else []),
                  ],
                  "sla": {"name": "Priority 2 restoration", "breached": False, "source": "simulated policy"},
                  "assignment_history": [
                      {"sequence": 0, "group": "Service Desk"},
                      {"sequence": 1, "group": "Major Incident Management"},
                      {"sequence": 2, "group": "Data Platform"},
                  ],
                  "related_records": {"problem": f"PRB{reference[3:]}", "jira": ["PLAT-1", "PLAT-2"]},
          ''')
          edit('src/worldloom/render/bundles.py', '''                "labels": [intent.domain, intent.artifact_type],
          ''', '''                "labels": [intent.domain, intent.artifact_type],
                          "status": "current" if not stale else "superseded",
                          "owner": intent.author_id,
                          "version_history": [{
                              "version": getattr(manifest, "version", 1) if manifest else 1,
                              "author": intent.author_id,
                              "state": getattr(manifest, "lifecycle", Lifecycle.DRAFT).value if manifest else "draft",
                          }],
                          "backlinks": [{"kind": "artifact", "id": source} for source in intent.derived_from],
                          "macros": [
                              {"type": "status", "value": "CURRENT" if not stale else "SUPERSEDED"},
                              {"type": "content-by-label", "label": intent.domain},
                          ],
          ''')
          p = Path('src/worldloom/render/bundles.py')
          text = p.read_text()
          if 'from ..models import Lifecycle' not in text:
              text = text.replace('from . import Rendered\n', 'from . import Rendered\nfrom ..models import Lifecycle\n', 1)
              p.write_text(text)

          edit('src/worldloom/cli.py', '''    out: Path = typer.Option(None, "--out", "-o", help="Write here instead of back into the corpus."),
              profile: str = typer.Option(
          ''', '''    out: Path = typer.Option(None, "--out", "-o", help="Write here instead of back into the corpus."),
              realism: bool = typer.Option(False, "--realism", help="Apply deterministic organisation DNA, lifecycle metadata and surface-specific artifact conventions."),
              profile: str = typer.Option(
          ''')
          edit('src/worldloom/cli.py', '''    world = _load(corpus)
              if profile is not None:
          ''', '''    world = _load(corpus)
              if realism:
                  try:
                      world = world.realize_artifacts()
                  except ValueError as exc:
                      _refuse("realism_failed", f"[red]error:[/red] {escape(str(exc))}")
              if profile is not None:
          ''')

          import shutil
          shutil.rmtree('.github/artifact-realism-transfer', ignore_errors=True)
          for name in ('artifact-realism-apply.yml', 'artifact-realism-build.yml', 'artifact-realism-integrate.yml'):
              Path('.github/workflows', name).unlink(missing_ok=True)
          PY
      - name: Install and verify
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[dev,polars,xlsx,docx,pdf,pptx]'
          python -m pip install ruff==0.15.8 mypy==2.3.1
          ruff check --fix src/worldloom/artifact_ecology.py src/worldloom/realism.py src/worldloom/render/docx.py src/worldloom/render/pptx.py src/worldloom/render/xlsx.py src/worldloom/render/bundles.py
          ruff check src/worldloom/artifact_ecology.py src/worldloom/realism.py src/worldloom/render/docx.py src/worldloom/render/pptx.py src/worldloom/render/xlsx.py src/worldloom/render/bundles.py
          mypy src/worldloom/artifact_ecology.py src/worldloom/realism.py
          pytest -q tests/test_docx.py tests/test_pptx.py tests/test_render.py
          python - <<'PY'
          from worldloom.retail import RetailWorld
          from worldloom.scenarios import MonthEndClose
          from worldloom.realism import evaluate
          w = RetailWorld(seed=8128).build().run(MonthEndClose(period='2026-03')).compile().realize_artifacts()
          r = evaluate(w)
          assert r.score > 0.6, r
          assert w.recipe['artifact_realism'] == 'ecology/v1'
          print(r.model_dump_json(indent=2))
          PY
      - name: Commit
        run: |
          git config user.name 'worldloom-artifact-realism-bot'
          git config user.email 'worldloom-artifact-realism-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Wire artifact ecology into enterprise renderers and bundles'
          git push origin HEAD:codex/worldloom-artifact-realism
