name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,polars]"

      - name: Tests
        run: pytest -q

      # The coherence gate, enforced rather than advisory: the golden episode
      # must validate, and a generated world must too.
      - name: Golden episode validates
        run: worldloom validate retail-close

      - name: Generated world validates
        run: worldloom build --seed 8128 --out "${{ runner.temp }}/generated"
