name: ci

# Push is restricted to the default branch on purpose: with `branches: ["**"]`
# every push to a PR branch triggers both a push run and a pull_request run, so
# each job runs twice for no extra signal.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint and types, blocking. This repository's stated position is that a
  # gate that is skipped is not a gate — so neither of these is advisory:
  # `ruff check` must exit 0 (config and per-rule rationale in
  # pyproject.toml), and `mypy` must exit 0 against the honest scope
  # pyproject.toml declares (104 of 163 modules held clean today, the rest on
  # a named debt list that is only allowed to shrink).
  #
  # Both tools are pinned exactly, unlike the library floors in pyproject: a
  # new ruff release enables new rules and a new mypy release finds new
  # errors, and either would turn an unrelated PR red. Bumping these pins is
  # a deliberate PR that fixes whatever the newer tool finds.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.11 — the package's declared floor, and deliberately so. The gate's
      # own config types at `python_version = "3.11"`, and running it on a
      # newer interpreter resolves a newer dependency set: 3.12 pulled numpy
      # 2.5, whose stubs use PEP 695 `type` statements a 3.11-targeted check
      # cannot parse, and numpy 2.5 ships no 3.11 wheels — so the failure was
      # unreproducible from any 3.11 dev environment and burned two CI rounds
      # before this line. Gating at the floor makes interpreter, typing target
      # and resolved dependencies one consistent story, and every failure
      # reproducible locally.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The project itself is installed because mypy follows imports into the
      # installed environment — pydantic's types are half the signal.
      - name: Install
        run: |
          pip install uv
          uv pip install --system -e ".[dev,polars,xlsx,docx,pdf,pptx]" \
            ruff==0.15.8 mypy==2.3.1

      - name: Lint gates
        run: ruff check

      - name: Type gate
        run: mypy

  dispersed-replay:
    # One interpreter, one small rotating sample.  This is deliberately not in
    # the three-version pytest matrix: byte identity is the property under test,
    # not compatibility with each supported Python minor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # uv rather than pip for the repo installs (verified to resolve this
      # project locally before the switch); the `package` job below keeps
      # pip/pipx deliberately, because it proves the wheel under the
      # installer users actually run.
      - name: Install
        run: |
          pip install uv
          uv pip install --system -e .

      - name: Dispersed byte-identity replay
        run: >-
          python .github/scripts/dispersed_replay.py
          --run-number "${{ github.run_number }}"
          --sample-size 3
          --root "${{ runner.temp }}/dispersed-replay"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install uv
          uv pip install --system -e ".[dev,polars,xlsx,docx,pdf,pptx]"

      - name: Tests
        if: matrix.python-version != '3.12'
        run: pytest -q

      # One leg measures coverage and prints it in the job log. Report-only
      # is deliberate and is not a skipped gate: a coverage *threshold* is a
      # proxy gate that invites test theatre — tests written to move a number
      # rather than to catch anything. Visibility is the product here; the
      # suite's pass/fail is the gate.
      - name: Tests (with coverage read-out)
        if: matrix.python-version == '3.12'
        run: |
          uv pip install --system pytest-cov
          pytest -q --cov=worldloom --cov-report=term

      # The agent-facing documents must describe the harness that exists. These
      # are what an agent reads before it knows anything, so a stale flag there
      # does not surface as an error it can reason about — it surfaces as a
      # thinner corpus with no sign anything was missed. The skill went fifteen
      # commits without mentioning `worldloom evaluate`; this is what catches
      # that class of drift.
      - name: The docs still describe the CLI
        run: worldloom docs --check

      # The coherence gate, enforced rather than advisory: the golden episode
      # must validate, and a generated world must too.
      - name: Golden episode validates
        run: worldloom validate retail-close

      - name: Generated world validates
        run: worldloom build --seed 8128 --out "${{ runner.temp }}/generated"

      - name: Rendered corpus validates
        run: |
          worldloom build --seed 8128 --incident \
            -f xlsx -f markdown -f docx -f jira -f confluence -f servicenow \
            --out "${{ runner.temp }}/rendered"
          worldloom validate "${{ runner.temp }}/rendered"

      # Scale, with the dimensional hierarchy on. A world with 34 categories and
      # 1,600 stores exercises roll-ups the three-unit world cannot reach, and its
      # workbook is where a wrong SUM range would first show up.
      - name: A large world validates
        run: |
          worldloom build --seed 8128 --incident \
            --archetype australian_grocery --comparatives 11 \
            -f xlsx -f markdown -f docx --out "${{ runner.temp }}/large"
          worldloom validate "${{ runner.temp }}/large"

      # The reference narration: real agent-written prose, accepted whole. Guards
      # the requests rather than the prose — a change that makes a request harder
      # to answer well shows up here and nowhere else. The model id is a
      # collective label: the file's prose has been written by more than one
      # Claude model over time (the close artifacts first, the fan-out layer's
      # commentary and thread later), each accepted through this same gate.
      - name: The reference narration is still accepted
        run: |
          worldloom build --seed 8128 --incident --archetype australian_grocery \
            --comparatives 11 --out "${{ runner.temp }}/reference"
          worldloom narrate accept "${{ runner.temp }}/reference" \
            --from examples/grocery-close/narration.json --model-id claude-agents
          worldloom render "${{ runner.temp }}/reference" -f docx -f xlsx -f markdown
          worldloom validate "${{ runner.temp }}/reference"

      # The analysis surfaces, on a corpus big enough for each to say something.
      # `topology` and `series` are readings rather than gates — they exit zero
      # on a corpus with a defect in it, because `validate` owns pass/fail — so
      # what this step proves is that they run at scale and that their JSON is
      # stable: the same corpus read twice must produce the same bytes, which is
      # the property that lets either one be diffed in a downstream CI at all.
      - name: The readings run and are stable
        run: |
          worldloom build --seed 8128 --incident --archetype australian_grocery \
            --comparatives 23 --trend 0.004 --narrate -f markdown \
            --out "${{ runner.temp }}/measured"
          worldloom topology "${{ runner.temp }}/measured" --json > /tmp/topology-a.json
          worldloom topology "${{ runner.temp }}/measured" --json > /tmp/topology-b.json
          diff /tmp/topology-a.json /tmp/topology-b.json
          worldloom series "${{ runner.temp }}/measured" --json > /tmp/series-a.json
          worldloom series "${{ runner.temp }}/measured" --json > /tmp/series-b.json
          diff /tmp/series-a.json /tmp/series-b.json
          worldloom diversity "${{ runner.temp }}/measured" --near-duplicates
          # And the trended build replays byte-for-byte like every other knob.
          worldloom build --seed 8128 --incident --archetype australian_grocery \
            --comparatives 23 --trend 0.004 --replay "${{ runner.temp }}/measured" \
            -f markdown --out "${{ runner.temp }}/measured-again"
          diff -r "${{ runner.temp }}/measured" "${{ runner.temp }}/measured-again"

      # The estate: generated on the engine that has pools, authored on the one
      # that does not. Both paths end at the same place — a landscape that
      # validates and a topology that can be read — and the composed corpus
      # additionally has to rebuild from its own ledger, because a
      # model-authored estate that only exists in the run that made it is one
      # run's output rather than an artifact.
      - name: The estate grows, composes, and rebuilds
        run: |
          worldloom build --seed 8128 --incident --archetype australian_grocery \
            --estate large --out "${{ runner.temp }}/estate"
          worldloom validate "${{ runner.temp }}/estate"
          worldloom topology "${{ runner.temp }}/estate" --json > /tmp/estate.json
          python3 - <<'EOF'
          import json
          reading = json.load(open("/tmp/estate.json"))
          assert len(reading["services"]) > 50, reading["services"][:3]
          assert len(reading["longest_dependency_chain"]) > 5, reading["longest_dependency_chain"]
          assert reading["chokepoints"], "a landscape with nothing gating anything is a diagram"
          assert not reading["dependency_cycles"]
          EOF
          # The composition handshake, driven by a scripted stand-in so the
          # contract is covered with no model in CI — the same posture the
          # narration and actor handshakes take.
          worldloom build --seed 8128 --archetype midsize_general_insurer \
            --out "${{ runner.temp }}/composed"
          worldloom compose requests "${{ runner.temp }}/composed" -o compose-request.json
          python3 tests/scripted_composer.py compose-request.json estate-response.json
          worldloom compose accept "${{ runner.temp }}/composed" --from estate-response.json \
            --model-id ci-scripted-composer
          worldloom validate "${{ runner.temp }}/composed"
          worldloom topology "${{ runner.temp }}/composed"
          # And an incoherent estate must be refused rather than committed.
          python3 tests/scripted_composer.py compose-request.json bad-estate.json --cycle
          if worldloom compose accept "${{ runner.temp }}/composed" --from bad-estate.json; then
            echo "a dependency cycle was accepted"
            exit 1
          fi

      # The repetition measurement, on a corpus that genuinely repeats: three
      # deterministic closes are one template stamped out three times, and the
      # readings must say so rather than report a clean corpus by having
      # nothing to look at. (The rewrite loop that used to act on this reading
      # was deleted — its target measured zero on real model prose across a
      # five-world proof run; the deterministic fake was the only writer that
      # ever repeated itself. The measurement stays because the question stays.)
      - name: The repetition measurement still reads
        run: |
          worldloom build --seed 8128 --incident --periods 3 --narrate -f markdown \
            --out "${{ runner.temp }}/repetitive"
          worldloom diversity "${{ runner.temp }}/repetitive" --near-duplicates \
            | grep -q "near-duplicate passage groups"
          # And the tool surface an agent is handed serves the same reading.
          worldloom mcp --tools | grep -q measure_corpus

      # The corpus has to be hard, not just coherent. A keyword baseline with no
      # notion of time or authority is scored against the evaluation set, and the
      # score is asserted to stay low on the types the corpus exists to pose. If
      # this number rises without someone deliberately improving the retriever,
      # the corpus got easier.
      - name: The baseline still fails the hard questions
        run: |
          worldloom build --seed 8128 --incident --narrate -f markdown \
            --out "${{ runner.temp }}/scored"
          worldloom evaluate "${{ runner.temp }}/scored" -v

      # Several closes on one world. Recurrence, superseded calendars, and the
      # evaluation families that a single episode cannot pose at all — and the
      # supersession invariants that only exist once documents get republished.
      - name: A series of closes validates and replays
        run: |
          FORMATS="-f xlsx -f markdown -f docx"
          worldloom build --seed 8128 --incident --periods 3 --narrate $FORMATS \
            --out "${{ runner.temp }}/series"
          worldloom validate "${{ runner.temp }}/series"
          worldloom evaluate "${{ runner.temp }}/series"
          worldloom build --seed 8128 --incident --periods 3 \
            --replay "${{ runner.temp }}/series" $FORMATS --out "${{ runner.temp }}/series-again"
          diff -r "${{ runner.temp }}/series" "${{ runner.temp }}/series-again"

      # The second vertical, end to end: the banking world builds, narrates,
      # renders, validates, and replays byte-for-byte with the provider
      # unreachable. Exercised here as well as in pytest because this is the
      # CLI's dispatch path — a banking corpus that only worked through the
      # Python API would be a vertical the tool's own front door cannot reach.
      - name: The banking vertical validates and replays
        run: |
          FORMATS="-f xlsx -f docx -f pdf -f markdown -f servicenow"
          worldloom build --seed 8128 --archetype midsize_adi --narrate $FORMATS \
            --out "${{ runner.temp }}/bank"
          worldloom validate "${{ runner.temp }}/bank"
          worldloom evaluate "${{ runner.temp }}/bank"
          worldloom build --seed 8128 --archetype midsize_adi \
            --replay "${{ runner.temp }}/bank" $FORMATS --out "${{ runner.temp }}/bank-again"
          diff -r "${{ runner.temp }}/bank" "${{ runner.temp }}/bank-again"

      # The third vertical, increment 1: phase 1 only, one valuation quarter.
      # Same shape as the banking step above — build, narrate, render,
      # validate, evaluate, replay byte-for-byte — because a corpus that only
      # worked through the Python API would be a vertical the tool's own
      # front door cannot reach.
      - name: The insurance vertical validates and replays
        run: |
          FORMATS="-f xlsx -f docx -f markdown"
          worldloom build --seed 8128 --archetype midsize_general_insurer --narrate $FORMATS \
            --out "${{ runner.temp }}/insurance"
          worldloom validate "${{ runner.temp }}/insurance"
          worldloom evaluate "${{ runner.temp }}/insurance"
          worldloom build --seed 8128 --archetype midsize_general_insurer \
            --replay "${{ runner.temp }}/insurance" $FORMATS --out "${{ runner.temp }}/insurance-again"
          diff -r "${{ runner.temp }}/insurance" "${{ runner.temp }}/insurance-again"

      # The shipped example packs, end to end: authored worlds through
      # unmodified engines. The greps assert the texture genuinely landed —
      # the insurer's incident speaks claims language, the mutual bank's
      # challenge names its own book — and the replay diff proves a
      # re-voiced corpus rebuilds its own voice from the recipe alone.
      - name: The example packs build, re-voice, and replay
        run: |
          worldloom pack check examples/packs/regional-insurer.json
          worldloom pack check examples/packs/mutual-bank.json
          worldloom build --seed 4242 --incident --pack examples/packs/regional-insurer.json \
            --narrate -f markdown --out "${{ runner.temp }}/insurer"
          # The re-voiced event lives on the timeline; the re-voiced cause is
          # cited into rendered prose. Both are asserted where they actually
          # land — the first version of this step grepped the artifacts for an
          # event summary and failed all three matrix jobs.
          grep -l "claims reserving pipeline" "${{ runner.temp }}/insurer/events.jsonl" >/dev/null
          grep -rl "peril-code mapping" "${{ runner.temp }}/insurer/artifacts" >/dev/null
          worldloom build --seed 7 --pack examples/packs/mutual-bank.json \
            --narrate -f markdown -f xlsx --out "${{ runner.temp }}/mutual"
          grep -l "Owner-Occupier" "${{ runner.temp }}/mutual/events.jsonl" >/dev/null
          worldloom build --seed 7 --pack examples/packs/mutual-bank.json \
            --replay "${{ runner.temp }}/mutual" -f markdown -f xlsx \
            --out "${{ runner.temp }}/mutual-again"
          diff -r "${{ runner.temp }}/mutual" "${{ runner.temp }}/mutual-again"

      # The agent handshake: a corpus asks for prose, and refuses prose that
      # restates a figure. Exercised with a scripted "agent" so the contract is
      # covered without a model in CI.
      - name: The agent handshake accepts and rejects
        run: |
          worldloom build --seed 8128 --incident --out "${{ runner.temp }}/agent"
          worldloom narrate requests "${{ runner.temp }}/agent" -o requests.json

          # The rejection first, while sections are still awaiting prose.
          #
          # This used to run *last*, against a corpus every section of which had
          # already been narrated — so `review()` had nothing to review, the
          # deliberately-invalid responses were never looked at, and the step
          # passed only because an unrelated `FileExistsError` in `export` made
          # the command exit non-zero. Fixing that bug is what revealed it. The
          # guardrail this step is named for had not been exercised since
          # rendering was added to it.
          python3 tests/scripted_agent.py requests.json bad.json --restate
          if worldloom narrate accept "${{ runner.temp }}/agent" --from bad.json; then
            echo "a restated figure was accepted — the guardrail is not working"
            exit 1
          fi

          # Then the good pass, which must still be accepted whole.
          python3 tests/scripted_agent.py requests.json responses.json
          worldloom narrate accept "${{ runner.temp }}/agent" --from responses.json \
            --model-id ci-scripted-agent
          worldloom render "${{ runner.temp }}/agent" -f markdown -f xlsx -f docx
          worldloom validate "${{ runner.temp }}/agent"

          # And submitting into a corpus with nothing left awaiting prose is an
          # error rather than a silent no-op — the exact shape that let the
          # rejection above go unexercised.
          if worldloom narrate accept "${{ runner.temp }}/agent" --from responses.json; then
            echo "responses were accepted into a corpus with nothing awaiting prose"
            exit 1
          fi

      # The actor handshake: the CLI hands out one employee's decision at a time
      # and refuses an illegal one. Driven by a scripted stand-in that reads only
      # the decision document — never the corpus — because an agent that opened
      # `facts.jsonl` to decide what the analyst should do would be reading the
      # world rather than that analyst's position in it, and every
      # information-asymmetry property would quietly stop holding.
      - name: The actor handshake accepts, refuses, and completes
        run: |
          CORPUS="${{ runner.temp }}/driven"
          worldloom build --seed 8128 --incident --actors agent --out "$CORPUS"

          # An overreaching call must be refused, and must commit nothing.
          worldloom act requests "$CORPUS" -o decision.json
          python3 tests/scripted_actor.py decision.json bad.json --overreach
          if worldloom act accept "$CORPUS" --from bad.json; then
            echo "a tool beyond the role's authority was accepted"
            exit 1
          fi

          # Then drive it to the end. The bound is generous; the episode is ~40
          # turns and a loop that does not terminate is the failure worth
          # catching here.
          for _ in $(seq 1 120); do
            worldloom act requests "$CORPUS" -o decision.json | tee out.txt
            grep -q "episode is complete" out.txt && break
            python3 tests/scripted_actor.py decision.json action.json
            worldloom act accept "$CORPUS" --from action.json
          done
          grep -q "episode is complete" out.txt || { echo "episode never completed"; exit 1; }
          worldloom validate "$CORPUS"

      # The actor episode: employees produce the incident's records by calling
      # tools on what they observed. Held to exactly the same standard as
      # narration, because it is the same claim — a decision taken by an actor is
      # a generative call, and a corpus whose decisions cannot be replayed is one
      # run's output rather than an artifact. Both providers are made unreachable
      # on the second pass, so a fallback that quietly regenerated would show up
      # as a diff rather than as a pass.
      - name: The actor episode replays byte-for-byte
        run: |
          FORMATS="-f xlsx -f markdown -f docx -f jira -f confluence -f servicenow"
          worldloom build --seed 8128 --incident --actors scripted --narrate $FORMATS \
            --out "${{ runner.temp }}/acted"
          worldloom validate "${{ runner.temp }}/acted"
          worldloom build --seed 8128 --incident --actors scripted \
            --replay "${{ runner.temp }}/acted" $FORMATS --out "${{ runner.temp }}/acted-again"
          diff -r "${{ runner.temp }}/acted" "${{ runner.temp }}/acted-again"

      # Narrate, then regenerate from the ledger with the provider unreachable,
      # and require the two corpora to be byte-identical. This is the project's
      # central claim, enforced rather than asserted.
      - name: Narration replays byte-for-byte
        run: |
          # Every format, including the two fixed-canvas ones. PPTX and PDF are
          # the formats most likely to leak a clock — python-pptx stamps zip
          # entry timestamps, and reportlab derives /CreationDate and the /ID
          # digest from time.time() unless told not to. If either regresses,
          # this diff is where it shows up.
          FORMATS="-f xlsx -f markdown -f docx -f pptx -f pdf -f jira -f confluence -f servicenow"
          worldloom build --seed 8128 --incident --narrate $FORMATS \
            --out "${{ runner.temp }}/narrated"
          worldloom build --seed 8128 --incident --replay "${{ runner.temp }}/narrated" \
            $FORMATS --out "${{ runner.temp }}/replayed"
          diff -r "${{ runner.temp }}/narrated" "${{ runner.temp }}/replayed"
          worldloom validate "${{ runner.temp }}/replayed"

  # The Windows leg, phase 1 of 2: inventory, not gate. Every byte-identity
  # claim this repository enforces has run on POSIX kernels only (ubuntu on
  # every push, macOS nightly in determinism-sweep.yml), while the package
  # calls itself "OS Independent" — this job is the first witness on Windows.
  # `continue-on-error: true` is deliberate and temporary: the expected
  # failures (CRLF from text-mode writes breaking byte-identity, hardcoded
  # /tmp, path-separator assumptions in tests) are the *inventory* this phase
  # exists to collect, so the job must run to completion and report without
  # blocking merges. Phase 2 fixes what it finds and flips this off — see
  # docs/plans/builder-revamp.md, item W7. Never make this leg green by
  # skipping a test.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    # The default shell on windows-latest is pwsh; bash (Git Bash, which the
    # runner ships) keeps these steps byte-identical to the linux test job's,
    # so a failure here is the OS, never a shell-translation artifact.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # One version only (3.12, the coverage leg's version on linux): the
      # 3.11–3.13 matrix is the linux job's job; the axis under test here is
      # the OS.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install uv
          uv pip install --system -e ".[dev,polars,xlsx,docx,pdf,pptx]"

      - name: Tests
        run: pytest -q

      # The coherence gate on the pinned example: proves the shipped corpus
      # loads and validates when read on a CRLF-native filesystem.
      - name: Golden episode validates
        run: worldloom validate retail-close

  # The artifact users install, not the checkout developers test. Everything the
  # test job proves is proven against the repo; this job proves the *wheel* —
  # that the bundled examples ship, that a bare install (no extras) works and
  # fails actionably where it cannot, and that the full install renders,
  # validates, and replays byte-for-byte. Run from outside the checkout so the
  # source tree cannot quietly stand in for the package.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build

      - name: A bare install works, and degrades legibly
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/bare/bin/worldloom version
          # The bundled golden episode must resolve from inside the wheel.
          /tmp/bare/bin/worldloom demo retail-close --out /tmp/demo
          # Formats with no optional dependency work out of the box.
          /tmp/bare/bin/worldloom build --seed 8128 --incident --narrate \
            -f markdown -f jira -f confluence -f servicenow --out /tmp/bare-corpus
          /tmp/bare/bin/worldloom validate /tmp/bare-corpus
          # A format whose dependency is missing must name the fix, not traceback.
          if /tmp/bare/bin/worldloom build --seed 8128 -f xlsx --out /tmp/nope 2>/tmp/err.txt; then
            echo "xlsx rendered without openpyxl installed"; exit 1
          fi
          grep -q "worldloom\[xlsx\]" /tmp/err.txt

      - name: The full install renders, validates, and replays
        run: |
          python -m venv /tmp/full
          WHEEL="$(readlink -f dist/*.whl)"
          /tmp/full/bin/pip install --quiet "worldloom[all] @ file://$WHEEL"
          cd /tmp
          FORMATS="-f xlsx -f docx -f pptx -f pdf -f markdown -f jira -f confluence -f servicenow"
          /tmp/full/bin/worldloom build --seed 8128 --incident --actors scripted --narrate \
            $FORMATS --out /tmp/one
          /tmp/full/bin/worldloom validate /tmp/one
          /tmp/full/bin/worldloom build --seed 8128 --incident --actors scripted \
            --replay /tmp/one $FORMATS --out /tmp/two
          diff -r /tmp/one /tmp/two

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
