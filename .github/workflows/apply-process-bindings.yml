name: apply audited process bindings
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths:
      - .github/workflows/apply-process-bindings.yml
      - .github/apply_process_bindings.py
      - .github/process-bindings-transfer/**
permissions:
  contents: write
concurrency:
  group: worldloom-audited-process-bindings
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply guarded source integration
        run: python .github/apply_process_bindings.py
      - name: Install checks
        run: python -m pip install -e '.[dev]' ruff==0.15.8 mypy==2.3.1
      - name: Lint and type check
        shell: bash
        run: |
          set -o pipefail
          ruff check src/worldloom/process_bindings src/worldloom/predicates.py src/worldloom/artifact_ecology.py tools/compile_process_bindings.py tools/harvest_esco_rdf.py tools/harvest_jira_bson.py tools/harvest_external_vocab.py tests/test_process_bindings.py tests/test_predicates.py tests/test_ecology_sdk.py tests/test_eval_interventions.py tests/test_eval_metrics.py | tee /tmp/bindings-lint.txt
          mypy src/worldloom/process_bindings src/worldloom/predicates.py src/worldloom/artifact_ecology.py | tee /tmp/bindings-types.txt
      - name: Validate bindings and existing integration contracts
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_process_bindings.py tests/test_predicates.py tests/test_ecology_sdk.py tests/test_process.py tests/test_lexicon.py tests/test_tool_surface.py tests/test_determinism_hygiene.py | tee /tmp/bindings-tests.txt
      - name: Prove all twelve source baselines and deterministic exports
        run: |
          python -m worldloom.process_bindings --all --out /tmp/bindings-one
          python -m worldloom.process_bindings --all --out /tmp/bindings-two
          diff -r /tmp/bindings-one /tmp/bindings-two
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from worldloom.process_bindings import baseline_parity, demands, verify_export
          plans = [verify_export(p) for p in sorted(Path('/tmp/bindings-one').glob('company-*'))]
          assert len(plans) == 12
          assert all(baseline_parity(p) for p in plans)
          assert sum(len(p.rows) for p in plans) == 6975
          counts = Counter(d.status for p in plans for d in demands(p))
          assert counts == {'bound_structural': 6151, 'binding_unresolved': 824, 'requires_runtime': 48825}
          result = {'industries': 12, 'bindings': 6975, 'source_parity': True, 'byte_identical_replay': True, 'demand_statuses': dict(counts), 'measured_calibrations': 0}
          Path('/tmp/bindings-verification.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Verify installed wheel resources
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/bindings-wheel .
          python -m pip install --no-deps --target /tmp/bindings-installed /tmp/bindings-wheel/worldloom-*.whl
          cd /tmp
          PYTHONPATH=/tmp/bindings-installed python - <<'PY'
          import worldloom
          from worldloom.process_bindings import baseline_parity, compile_company, default_company
          assert worldloom.__file__.startswith('/tmp/bindings-installed/')
          compiled = compile_company(default_company('retail'))
          assert len(compiled.rows) == 362
          assert baseline_parity(compiled)
          print('Installed wheel resource and source parity checks passed.')
          PY
      - name: Commit tested implementation only
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/process-bindings-paths.txt
          git rm -r .github/process-bindings-transfer
          git rm .github/apply_process_bindings.py .github/workflows/apply-process-bindings.yml
          git diff --cached --check
          git commit -m 'Integrate audited process bindings with source parity, tool surfaces and replay'
          git push origin HEAD:codex/worldloom-artifact-realism
          git rev-parse HEAD > /tmp/bindings-commit.txt
          git archive --format=tar.gz HEAD > /tmp/bindings-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audited-process-bindings
          retention-days: 14
          path: |
            /tmp/bindings-one
            /tmp/bindings-lint.txt
            /tmp/bindings-types.txt
            /tmp/bindings-tests.txt
            /tmp/bindings-verification.json
            /tmp/bindings-commit.txt
            /tmp/bindings-source.tar.gz
