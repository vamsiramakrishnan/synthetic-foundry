name: verify connector thin-waist type fixes
on:
  push:
    branches: [codex/connector-definition-thin-waist]
    paths:
      - .github/workflows/connector-thin-waist-type-fix.yml
permissions:
  contents: write
concurrency:
  group: connector-thin-waist-type-fix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/connector-definition-thin-waist
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply exact type-narrowing patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one match, found {count}: {old!r}"
              p.write_text(text.replace(old, new, 1))

          q = "src/worldloom/connector_query.py"
          replace_once(q,
              '    if item.op is PredicateOp.EQ:\n        if value is None:\n            return f"{field} is EMPTY" if language == "jql" else f"{field} = null"\n        return f"{field} = {_quote(value)}"',
              '    if item.op is PredicateOp.EQ:\n        if value is None:\n            return f"{field} is EMPTY" if language == "jql" else f"{field} = null"\n        assert not isinstance(value, tuple)\n        return f"{field} = {_quote(value)}"')
          replace_once(q,
              '    if item.op is PredicateOp.NE:\n        if value is None:\n            return f"{field} is not EMPTY" if language == "jql" else f"{field} != null"\n        return f"{field} != {_quote(value)}"',
              '    if item.op is PredicateOp.NE:\n        if value is None:\n            return f"{field} is not EMPTY" if language == "jql" else f"{field} != null"\n        assert not isinstance(value, tuple)\n        return f"{field} != {_quote(value)}"')
          replace_once(q,
              '    if item.op is PredicateOp.EQ:\n        return f"{field}ISEMPTY" if value is None else f"{field}={_atom(value)}"',
              '    if item.op is PredicateOp.EQ:\n        if value is None:\n            return f"{field}ISEMPTY"\n        assert not isinstance(value, tuple)\n        return f"{field}={_atom(value)}"')
          replace_once(q,
              '    if item.op is PredicateOp.NE:\n        return f"{field}ISNOTEMPTY" if value is None else f"{field}!={_atom(value)}"',
              '    if item.op is PredicateOp.NE:\n        if value is None:\n            return f"{field}ISNOTEMPTY"\n        assert not isinstance(value, tuple)\n        return f"{field}!={_atom(value)}"')

          p = "src/worldloom/connector_payload.py"
          replace_once(p,
              '        base = datetime.fromisoformat(definition.clock)\n        value = base - timedelta(days=int(token[:8], 16) % 730)',
              '        clock_base = datetime.fromisoformat(definition.clock)\n        value = clock_base - timedelta(days=int(token[:8], 16) % 730)')
          replace_once(p,
              '    base = f"{field.name} {token[:12]}"\n    if field.field_type == "rich_text":\n        repetitions = max(1, field.average_bytes // max(1, len(base) + 1))\n        return " ".join(base for _ in range(repetitions))[: field.average_bytes]\n    return base',
              '    rendered = f"{field.name} {token[:12]}"\n    if field.field_type == "rich_text":\n        repetitions = max(1, field.average_bytes // max(1, len(rendered) + 1))\n        return " ".join(rendered for _ in range(repetitions))[: field.average_bytes]\n    return rendered')

          e = "src/worldloom/connector_emulator.py"
          replace_once(e,
              '        seen: set[str] = set()\n        return [\n            self.records[fid]\n            for fid in pool_ids\n            if not (fid in seen or seen.add(fid)) and self._visible(fid)\n        ]',
              '        seen: set[str] = set()\n        visible: list[dict[str, Any]] = []\n        for fid in pool_ids:\n            if fid in seen:\n                continue\n            seen.add(fid)\n            if self._visible(fid):\n                visible.append(self.records[fid])\n        return visible')

          a = "src/worldloom/artifact_shape_materialize.py"
          replace_once(a,
              '        if is_evidence and ppt_locator.element in {"text", "table", "hidden_slide"}:\n            body.text_frame.text = evidence_text\n        if is_evidence and ppt_locator.element == "hidden_slide":',
              '        if ppt_locator is not None and is_evidence and ppt_locator.element in {"text", "table", "hidden_slide"}:\n            body.text_frame.text = evidence_text\n        if ppt_locator is not None and is_evidence and ppt_locator.element == "hidden_slide":')
          replace_once(a, '    presentation.save(out)', '    presentation.save(str(out))')
          replace_once(a, '    document.save(out)', '    document.save(str(out))')
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]' ruff==0.15.8 mypy==2.3.1
      - name: Static gates
        run: |
          ruff check
          mypy
      - name: Focused connector and shape regressions
        run: |
          pytest -q \
            tests/test_connector_definition.py \
            tests/test_connector_query.py \
            tests/test_connector_fields.py \
            tests/test_connector_payload.py \
            tests/test_connector_emulator.py \
            tests/test_connector_seed.py \
            tests/test_connector_trace.py \
            tests/test_connector_100k_coverage.py \
            tests/test_eval_shape.py \
            tests/test_eval_shape_apply.py \
            tests/test_eval_connectors.py \
            tests/test_artifact_shape_materialize.py
      - name: Commit only the verified fixes
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/connector-thin-waist-type-fix.yml
          git add src/worldloom/connector_query.py src/worldloom/connector_payload.py src/worldloom/connector_emulator.py src/worldloom/artifact_shape_materialize.py
          git diff --cached --check
          git commit -m 'Narrow connector thin-waist runtime types under full static gates'
          git push origin HEAD:codex/connector-definition-thin-waist
