name: fix artifact ecology annotations
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-lint-fix-current.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.15.8
      - run: ruff check src/worldloom/artifact_ecology.py --fix
      - run: ruff check src/worldloom/artifact_ecology.py
      - name: Commit annotation cleanup
        run: |
          test -z "$(git diff --name-only -- . ':!src/worldloom/artifact_ecology.py')"
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/artifact_ecology.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix artifact ecology type annotations'
          git push origin HEAD:codex/worldloom-artifact-realism
