# one-shot gate; deletes itself after canonical ledger integration
name: structural canonical fact view integration
on:
  push:
    branches: [codex/structural-uplift]
    paths:
      - .github/workflows/structural-ledger-integrate.yml
permissions:
  contents: write
concurrency:
  group: structural-ledger-integrate
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/structural-uplift
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Route read-facing fact resolution through the canonical ledger
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one match, found {count}: {old!r}"
              file.write_text(text.replace(old, new, 1))

          collections = 'src/worldloom/collections.py'
          replace_once(
              collections,
              'from .epistemics import ledger_from_facts',
              'from .fact_ledger import FactLedger',
          )
          replace_once(
              collections,
              'ledger_from_facts(self).view(',
              'FactLedger(self).view(',
          )

          predicates = 'src/worldloom/predicates.py'
          replace_once(
              predicates,
              'from .epistemics import ledger_from_facts',
              'from .fact_ledger import FactLedger',
          )
          replace_once(
              predicates,
              'ledger_from_facts(relevant).view(',
              'FactLedger(relevant).view(',
          )

          world = 'src/worldloom/world.py'
          replace_once(
              world,
              'from .detail import DetailTable\nfrom .ids import Minter',
              'from .detail import DetailTable\nfrom .fact_ledger import FactLedger\nfrom .ids import Minter',
          )
          marker = '    def as_of(self, moment: datetime | str) -> FactCollection:\n'
          methods = '''    def fact_ledger(self) -> FactLedger:\n        """The complete append-only canonical fact history.\n\n        Generators, validators, replay, and provenance use this raw ledger.\n        User-facing truth/belief reads should call :meth:`fact_view` instead.\n        """\n        return FactLedger(self._facts)\n\n    def fact_view(\n        self,\n        observer: str,\n        *,\n        valid_at: datetime | str,\n        tx_at: datetime | str,\n    ) -> FactCollection:\n        """Resolve what *observer* could know about one business-time cut.\n\n        Both axes are mandatory. There is no implicit wall clock and no silent\n        fallback to the latest value, so replay is independent of run time.\n        """\n        resolved = self.fact_ledger().view(\n            observer,\n            valid_at=_moment(valid_at),\n            tx_at=_moment(tx_at),\n        )\n        return FactCollection(resolved.to_tuple(), label="FactView")\n\n'''
          replace_once(world, marker, methods + marker)
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]' ruff==0.15.8 mypy==2.3.1
      - name: Normalize the compatibility adapter
        run: ruff check --fix src/worldloom/epistemics.py
      - name: Validate canonical and compatibility fact reads
        run: |
          ruff check
          mypy
          pytest -q tests/test_fact_ledger.py tests/test_epistemics.py tests/test_predicates.py tests/test_collections.py
      - name: Commit canonical fact-view migration
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/epistemics.py
          if ! git diff --cached --quiet; then
            git commit -m 'Format the deprecated observation compatibility adapter'
          fi
          git add src/worldloom/world.py
          git commit -m 'Expose explicit bitemporal fact views on World'
          git add src/worldloom/collections.py src/worldloom/predicates.py
          git commit -m 'Route internal fact views through the canonical ledger'
          if [ -f .github/workflows/structural-ledger-audit.yml ]; then
            git rm .github/workflows/structural-ledger-audit.yml
            git commit -m 'Remove completed ledger read-path audit'
          fi
          git rm .github/workflows/structural-ledger-integrate.yml
          git commit -m 'Remove completed ledger integration workflow'
          git push origin HEAD:codex/structural-uplift
