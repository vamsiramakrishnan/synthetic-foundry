# one-shot gate; deletes itself after canonical ledger integration
name: structural canonical fact view integration
on:
  push:
    branches: [codex/structural-uplift]
    paths:
      - .github/workflows/structural-ledger-integrate.yml
permissions:
  contents: write
concurrency:
  group: structural-ledger-integrate
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/structural-uplift
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Route read-facing fact resolution through the canonical ledger
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              assert count == 1, f"{path}: expected one match, found {count}: {old!r}"
              file.write_text(text.replace(old, new, 1))

          collections = 'src/worldloom/collections.py'
          replace_once(
              collections,
              '''        from .epistemics import ledger_from_facts

          return FactCollection(ledger_from_facts(self).view(
              observer, valid_at=valid_at, tx_at=tx_at,
          ))''',
              '''        from .fact_ledger import FactLedger

          return FactCollection(
              FactLedger(self).view(
                  observer, valid_at=valid_at, tx_at=tx_at,
              ).to_tuple(),
              label="FactView",
          )''',
          )

          predicates = 'src/worldloom/predicates.py'
          replace_once(
              predicates,
              'from .epistemics import ledger_from_facts\n',
              'from .fact_ledger import FactLedger\n',
          )
          replace_once(
              predicates,
              '        view = ledger_from_facts(relevant).view(as_of.observer, valid_at=valid_at, tx_at=tx_at)\n',
              '        view = FactLedger(relevant).view(as_of.observer, valid_at=valid_at, tx_at=tx_at)\n',
          )

          world = 'src/worldloom/world.py'
          replace_once(
              world,
              'from .detail import DetailTable\nfrom .ids import Minter\n',
              'from .detail import DetailTable\nfrom .fact_ledger import FactLedger\nfrom .ids import Minter\n',
          )
          anchor = '''    def as_of(self, moment: datetime | str) -> FactCollection:
              """The facts that held at *moment* — the temporal cut-off primitive.

              This is what makes a temporal question meaningful: the world of
              09:30 genuinely differs from the world of 14:00.
              """
              return self.facts.at(_moment(moment))
          '''
          replacement = '''    def fact_ledger(self) -> FactLedger:
              """The complete append-only canonical fact history.

              Generators, validators, replay, and provenance use this raw ledger.
              User-facing truth/belief reads should call :meth:`fact_view` instead.
              """
              return FactLedger(self._facts)

              def fact_view(
                  self,
                  observer: str,
                  *,
                  valid_at: datetime | str,
                  tx_at: datetime | str,
              ) -> FactCollection:
                  """Resolve what *observer* could know about one business-time cut.

                  Both axes are mandatory. There is no implicit wall clock and no
                  silent fallback to the latest value, so replaying the same query
                  against the same world always resolves the same facts.
                  """
                  resolved = self.fact_ledger().view(
                      observer,
                      valid_at=_moment(valid_at),
                      tx_at=_moment(tx_at),
                  )
                  return FactCollection(resolved.to_tuple(), label="FactView")

              def as_of(self, moment: datetime | str) -> FactCollection:
                  """Compatibility valid-time slice of the raw ledger.

                  This predates observer and transaction-time facts. New read-facing
                  code should use :meth:`fact_view`; structural code may still need
                  every raw row that held at a business-time instant.
                  """
                  return self.facts.at(_moment(moment))
          '''
          replace_once(world, anchor, replacement)
          PY
      - name: Install validation dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e '.[dev,polars,xlsx,docx,pdf,pptx]' ruff==0.15.8 mypy==2.3.1
      - name: Validate canonical and compatibility fact reads
        run: |
          ruff check
          mypy
          pytest -q tests/test_fact_ledger.py tests/test_epistemics.py tests/test_predicates.py tests/test_collections.py
      - name: Commit canonical fact-view migration
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/world.py
          git commit -m 'Expose explicit bitemporal fact views on World'
          git add src/worldloom/collections.py src/worldloom/predicates.py
          git commit -m 'Route internal fact views through the canonical ledger'
          if [ -f .github/workflows/structural-ledger-audit.yml ]; then
            git rm .github/workflows/structural-ledger-audit.yml
            git commit -m 'Remove completed ledger read-path audit'
          fi
          git rm .github/workflows/structural-ledger-integrate.yml
          git commit -m 'Remove completed ledger integration workflow'
          git push origin HEAD:codex/structural-uplift
