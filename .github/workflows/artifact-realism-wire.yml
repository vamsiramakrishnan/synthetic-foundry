name: wire artifact ecology
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-wire.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply narrow integration patches
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("docx.py", "pptx.py", "xlsx.py"):
              path = Path("src/worldloom/render") / name
              text = path.read_text()
              old = '    raw = ir.metadata.get("worldloom_seed")\n    seed = int(raw) if raw and raw != "None" else 0\n'
              new = '    raw = ir.metadata.get("style_seed") or ir.metadata.get("worldloom_seed")\n    seed = int(raw) if raw and raw != "None" else 0\n'
              if old not in text:
                  raise SystemExit(f"style seed seam not found in {path}")
              path.write_text(text.replace(old, new, 1))

          path = Path("src/worldloom/connector_data.py")
          text = path.read_text()
          old = '    return ConnectorDataset(capabilities=capabilities, records=records)\n'
          new = '''    if world.recipe.get("artifact_realism") == "ecology/v1":\n        from .artifact_ecology import enrich_connector_records\n\n        records = enrich_connector_records(world, records)\n    return ConnectorDataset(capabilities=capabilities, records=records)\n'''
          if text.count(old) != 1:
              raise SystemExit("connector dataset return seam changed")
          path.write_text(text.replace(old, new, 1))

          path = Path("src/worldloom/world.py")
          text = path.read_text()
          old = '        staged = self if self._artifact_irs else self.compile()\n        irs = staged._artifact_irs\n\n        rendered: list[render_module.Rendered] = []\n'
          new = '''        staged = self if self._artifact_irs else self.compile()\n        if staged.recipe.get("artifact_realism") == "ecology/v1":\n            from .artifact_ecology import enrich_world\n\n            staged = enrich_world(staged)\n        irs = staged._artifact_irs\n\n        rendered: list[render_module.Rendered] = []\n'''
          if old not in text:
              raise SystemExit("World.render staging seam changed")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate patched paths
        run: |
          python -m pip install -e '.[dev]' ruff==0.15.8 mypy==2.3.1
          ruff check src/worldloom/connector_data.py src/worldloom/world.py src/worldloom/render/docx.py src/worldloom/render/pptx.py src/worldloom/render/xlsx.py src/worldloom/artifact_ecology.py src/worldloom/ecology.py
          pytest -q tests/test_artifact_realism.py tests/test_ecology_sdk.py tests/test_docx.py tests/test_pptx.py tests/test_xlsx.py tests/test_connector_data.py
      - name: Commit integration
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/connector_data.py src/worldloom/world.py src/worldloom/render/docx.py src/worldloom/render/pptx.py src/worldloom/render/xlsx.py
          git commit -m 'Wire artifact ecology into renderers and connectors'
          git push origin HEAD:codex/worldloom-artifact-realism
