name: PR33 merge gate fix
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths:
      - .github/workflows/pr33-merge-gate-fix.yml
permissions:
  contents: write
concurrency:
  group: pr33-merge-gate-fix
  cancel-in-progress: false
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply semantic review fixes
        run: python tools/fix_pr33_merge_gate.py
      - name: Install full CI dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,polars,xlsx,docx,pdf,pptx]" ruff==0.15.8 mypy==2.3.1
      - name: Canonicalize merge-gate debt and compatibility contracts
        run: |
          ruff check --fix src/worldloom/process_catalogue.py tools/finalize_process_catalogue.py tests/test_pr33_merge_gate.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/worldloom/process_catalogue.py')
          text = path.read_text(encoding='utf-8')
          old = '    totals = Counter()\n'
          new = '    totals: Counter[str] = Counter()\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('missing expected Counter type-debt anchor')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          pdf = Path('src/worldloom/render/pdf.py')
          text = pdf.read_text(encoding='utf-8')
          old = '("lifecycle_version", "lifecycle"),'
          new = '("lifecycle", "lifecycle"),'
          if new not in text:
              if old not in text:
                  raise SystemExit('missing expected PDF lifecycle metadata anchor')
              pdf.write_text(text.replace(old, new, 1), encoding='utf-8')

          transform = Path('src/worldloom/world_transforms.py')
          text = transform.read_text(encoding='utf-8')
          old = '''        recorded_recipe = with_step(\n            world.recipe, "AddIrrelevantFacts", seed=seed, count=self.count\n        )\n        if not self.count:\n            return TransformResult(\n                world=replace(world, _recipe=recorded_recipe),\n'''
          new = '''        if not self.count:\n            return TransformResult(\n                world=world,\n'''
          if old not in text:
              raise SystemExit('missing expected zero-noise recipe anchor')
          text = text.replace(old, new, 1)
          old = '''                oracle_effect=OracleEffect.PRESERVE,\n            )\n        anchor = min((fact.valid_from for fact in world.facts), default=None)\n'''
          new = '''                oracle_effect=OracleEffect.PRESERVE,\n            )\n        recorded_recipe = with_step(\n            world.recipe, "AddIrrelevantFacts", seed=seed, count=self.count\n        )\n        anchor = min((fact.valid_from for fact in world.facts), default=None)\n'''
          if old not in text:
              raise SystemExit('missing expected nonzero-noise recipe anchor')
          transform.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Lint and type gates
        run: |
          ruff check
          mypy
      - name: Focused review regressions
        run: |
          pytest -q tests/test_pr33_merge_gate.py tests/test_eval_candidates.py tests/test_eval_reference.py tests/test_pdf_ecology.py tests/test_world_transforms.py
      - name: Full unit suite
        run: pytest -q
      - name: CLI docs and coherence smoke gates
        run: |
          worldloom docs --check
          worldloom validate retail-close
          worldloom build --seed 8128 --out "${{ runner.temp }}/generated"
      - name: Commit only after gates pass
        run: |
          git config user.name 'worldloom-merge-gate-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/eval_candidates.py src/worldloom/eval_instances.py src/worldloom/eval_reference.py src/worldloom/artifact_ecology.py src/worldloom/render/pdf.py src/worldloom/world_transforms.py src/worldloom/recipe.py src/worldloom/process_catalogue.py tools/finalize_process_catalogue.py CHANGELOG.md tests/test_pr33_merge_gate.py
          git rm tools/fix_pr33_merge_gate.py .github/workflows/pr33-merge-gate-fix.yml
          git diff --cached --check
          git commit -m 'Fix PR review correctness and replay merge gates'
          git push origin HEAD:codex/worldloom-artifact-realism
