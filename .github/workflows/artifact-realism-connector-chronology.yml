name: add connector lifecycle chronology
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-connector-chronology.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Give connector histories deterministic simulated timestamps
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worldloom/artifact_ecology.py')
          text = path.read_text()
          text = text.replace('from datetime import timedelta\n', 'from datetime import datetime, timedelta\n', 1)

          old = '''            opened = fields.get("opened_at") or fields.get("created_at")\n            final = str(fields.get("state", "")).lower()\n            states = ["New", "In Progress"] + (["Resolved", "Closed"] if final in {"resolved", "closed", "complete"} else [])\n'''
          new = '''            opened = fields.get("opened_at") or fields.get("created_at")\n            anchor = datetime.fromisoformat(str(opened)) if opened else (world.timeline()[0].occurred_at if world.timeline() else None)\n            def at(minutes: int, base=anchor) -> str | None:\n                return (base + timedelta(minutes=minutes)).isoformat() if base else None\n\n            final = str(fields.get("state", "")).lower()\n            states = ["New", "In Progress"] + (["Resolved", "Closed"] if final in {"resolved", "closed", "complete"} else [])\n'''
          if old not in text:
              raise SystemExit('servicenow anchor seam changed')
          text = text.replace(old, new, 1)

          old = '''            fields.setdefault("state_history", [{"state": state, "sequence": i, "at": opened} for i, state in enumerate(states)])\n            fields.setdefault("work_notes", [\n                {"sequence": 1, "kind": "triage", "text": "Impact confirmed; investigation opened."},\n                {"sequence": 2, "kind": "diagnosis", "text": "Evidence linked to correlated business event."},\n                {"sequence": 3, "kind": "closure", "text": "Resolution recorded against source evidence."},\n            ])\n'''
          new = '''            fields.setdefault("state_history", [{"state": state, "sequence": i, "at": at(i * 30)} for i, state in enumerate(states)])\n            fields.setdefault("work_notes", [\n                {"sequence": 1, "at": at(10), "kind": "triage", "text": "Impact confirmed; investigation opened."},\n                {"sequence": 2, "at": at(45), "kind": "diagnosis", "text": "Evidence linked to correlated business event."},\n                {"sequence": 3, "at": at(120), "kind": "closure", "text": "Resolution recorded against source evidence."},\n            ])\n'''
          if old not in text:
              raise SystemExit('servicenow history seam changed')
          text = text.replace(old, new, 1)

          old = '''        elif record.connector == "jira":\n            status = fields.get("status", "To Do")\n            history = [{"from": None, "to": "To Do", "sequence": 0}]\n            if status != "To Do":\n                history.append({"from": "To Do", "to": "In Progress", "sequence": 1})\n            if status == "Done":\n                history.append({"from": "In Progress", "to": "Done", "sequence": 2})\n            fields.setdefault("status_history", history)\n            fields.setdefault("links", [{"type": "relates to", "target": event_id} for event_id in record.event_ids])\n            fields.setdefault("activity", [{"kind": "comment", "sequence": 1, "text": "Scope confirmed against source evidence."}])\n'''
          new = '''        elif record.connector == "jira":\n            status = fields.get("status", "To Do")\n            created = fields.get("created_at")\n            anchor = datetime.fromisoformat(str(created)) if created else (world.timeline()[0].occurred_at if world.timeline() else None)\n            def jira_at(minutes: int, base=anchor) -> str | None:\n                return (base + timedelta(minutes=minutes)).isoformat() if base else None\n\n            history = [{"from": None, "to": "To Do", "sequence": 0, "at": jira_at(0)}]\n            if status != "To Do":\n                history.append({"from": "To Do", "to": "In Progress", "sequence": 1, "at": jira_at(20)})\n            if status == "Done":\n                history.append({"from": "In Progress", "to": "Done", "sequence": 2, "at": jira_at(180)})\n            fields.setdefault("status_history", history)\n            fields.setdefault("links", [{"type": "relates to", "target": event_id} for event_id in record.event_ids])\n            fields.setdefault("activity", [{"kind": "comment", "sequence": 1, "at": jira_at(35), "text": "Scope confirmed against source evidence."}])\n'''
          if old not in text:
              raise SystemExit('jira history seam changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: |
          python -m pip install -e '.[dev]' ruff==0.15.8
          ruff check src/worldloom/artifact_ecology.py tests/test_connector_ecology.py
          pytest -q tests/test_connector_ecology.py tests/test_ecology_sdk.py
      - name: Commit only connector chronology
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/artifact_ecology.py
          git commit -m 'Give connector histories simulated chronology'
          git push origin HEAD:codex/worldloom-artifact-realism
