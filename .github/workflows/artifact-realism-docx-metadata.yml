name: add docx ecology metadata
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-docx-metadata.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Add machine-readable controlled document metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worldloom/render/docx.py')
          text = path.read_text()
          old = '''    if ir.metadata.get("voice") and presentation.provenance == "properties":\n        # Word's own "category" field, which no reader of the document sees\n        # and every corpus tool can read. The brief is worth keeping — it is\n        # how a later reader knows why a memo sounds the way it does — and\n        # the only thing wrong with it was being the last paragraph.\n        properties.category = (\n            f"voice: {ir.metadata['voice']}; persona: {ir.metadata.get('persona', '')}"\n        )\n\n    from io import BytesIO\n'''
          new = '''    categories: list[str] = []\n    if ir.metadata.get("voice") and presentation.provenance == "properties":\n        # Word's own "category" field, which no reader of the document sees\n        # and every corpus tool can read. The brief is worth keeping — it is\n        # how a later reader knows why a memo sounds the way it does — and\n        # the only thing wrong with it was being the last paragraph.\n        categories.append(\n            f"voice: {ir.metadata['voice']}; persona: {ir.metadata.get('persona', '')}"\n        )\n    if ir.metadata.get("realism_profile") == "ecology/v1":\n        categories.extend((\n            "worldloom-realism=ecology/v1",\n            f"lifecycle={ir.metadata.get('lifecycle', 'draft')}",\n            f"revision={ir.metadata.get('revision', '1')}",\n            f"family={ir.metadata.get('artifact_family', 'document')}",\n        ))\n    if categories:\n        properties.category = "; ".join(categories)\n\n    from io import BytesIO\n'''
          if old not in text:
              raise SystemExit('DOCX properties seam changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: |
          python -m pip install -e '.[dev]' ruff==0.15.8
          ruff check src/worldloom/render/docx.py tests/test_docx_ecology.py
          pytest -q tests/test_docx_ecology.py tests/test_render.py
      - name: Commit only DOCX metadata
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/render/docx.py
          git commit -m 'Add lifecycle metadata to ecology Word documents'
          git push origin HEAD:codex/worldloom-artifact-realism
