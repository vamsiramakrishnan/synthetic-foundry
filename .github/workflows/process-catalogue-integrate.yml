name: integrate supplied process catalogue
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths:
      - .github/workflows/process-catalogue-integrate.yml
permissions:
  contents: write
concurrency:
  group: process-catalogue-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply content-verified implementation
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, io, json, lzma, re, subprocess
          from pathlib import Path
          parts = sorted(Path('.github/process-catalogue-transfer').glob('part*'))
          assert [p.name for p in parts] == [f'part{i:02}' for i in range(8)]
          blob = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(blob).hexdigest() == '1ff8235fbc97ccffdce61813224212a243bfbbe1408ba16a8e96d64a497af825', 'transfer digest mismatch'
          payload = json.loads(lzma.decompress(blob))
          allowed = {
              '.claude/skills/worldloom-process-catalogue/SKILL.md',
              'docs/process-catalogue.md', 'docs/design/vocabulary-input.md',
              'src/worldloom/_data/processes/catalogue.json.gz',
              'src/worldloom/_data/processes/defaults.json.gz',
              'src/worldloom/_data/processes/intake.json',
              'src/worldloom/process_catalogue/__init__.py',
              'src/worldloom/process_catalogue/__main__.py',
              'src/worldloom/process_catalogue/models.py',
              'src/worldloom/process_catalogue/compiler.py',
              'src/worldloom/process_catalogue/io.py',
              'tests/test_process_catalogue.py',
              'tools/compile_processes.py', 'tools/import_process_catalogue.py',
          }
          assert len(payload['files']) == len(allowed)
          assert {e['path'] for e in payload['files']} == allowed
          def adapt(text):
              for old, new in (
                  ('worldloom.process_catalogue', 'worldloom.process_planning'),
                  ('.process_catalogue', '.process_planning'),
                  ('src/worldloom/process_catalogue', 'src/worldloom/process_planning'),
                  ('tests/test_process_catalogue.py', 'tests/test_process_planning.py'),
                  ('tools/compile_processes.py', 'tools/compile_process_plans.py'),
                  ('tools/import_process_catalogue.py', 'tools/import_process_plans.py'),
              ):
                  text = text.replace(old, new)
              return text
          for entry in payload['files']:
              path = Path(adapt(entry['path']))
              assert not path.exists(), f'refusing to overwrite {path}'
          for entry in payload['files']:
              path = Path(adapt(entry['path']))
              if entry['encoding'] == 'gzip':
                  target = io.BytesIO()
                  with gzip.GzipFile(filename='', fileobj=target, mode='wb', mtime=0) as stream:
                      stream.write(entry['content'].encode('utf-8'))
                  raw = target.getvalue()
              else:
                  assert entry['encoding'] == 'utf8'
                  content = adapt(entry['content'])
                  if entry['path'] == 'docs/process-catalogue.md':
                      lines = content.splitlines(keepends=True)
                      lines.insert(2, 'This guide uses `worldloom.process_planning`. The existing `worldloom.process_catalogue` API remains a source-reference importer: it reproduces uploaded rows and their original status labels. Those labels do not prove that calibration was applied. Use the planning API below for authoring, diagnostics and operational coverage.\n\n')
                      content = ''.join(lines)
                  raw = content.encode('utf-8')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
          patch = Path('/tmp/process-catalogue.patch')
          patch.write_text(adapt(payload['process_patch']), encoding='utf-8')
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          match = re.search(r'(?m)^##.*Unreleased.*$', text)
          assert match, 'missing Unreleased changelog heading'
          note = '\n\n### Generation - opt-in authored process planning\n\n- Integrate the supplied 12-industry factors with typed company, owner, country and system bindings, named-stream channel draws, source-attested lexicon records and pinned offline replay. Existing world builds and the source-reference catalogue API do not change.\n- Feed activity context into the existing process authoring cascade without bypassing its validation gates. APQC references remain hints; calibration names remain requests; template pairs are not executable evaluations.\n- Expose missing streams, fallback owners and unresolved system schemas. Retain source hashes, licence declarations, coverage and replay manifests.\n'
          changelog.write_text(text[:match.end()] + note + text[match.end():], encoding='utf-8')
          docs = Path('docs/README.md')
          text = docs.read_text(encoding='utf-8')
          text += '\n\n## Authored industry process planning\n\n[Compile company process plans](process-catalogue.md) from the supplied 12-industry factors. Bind activities to owners, countries, systems and seeded channels; inspect coverage and evidence boundaries; replay pinned exports; feed the existing process authoring cascade. The source-reference catalogue API remains unchanged.\n'
          docs.write_text(text, encoding='utf-8')
          print('Verified payload and applied process planning without overwriting the source-reference importer or its tests.')
          PY
      - name: Install checks
        run: python -m pip install -e '.[dev]' ruff==0.15.8 mypy==2.3.1
      - name: Lint and type-check integration
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check src/worldloom/process_planning src/worldloom/process.py tools/compile_process_plans.py tools/import_process_plans.py tests/test_process_planning.py | tee /tmp/process-lint.txt
          python -m mypy src/worldloom/process_planning src/worldloom/process.py | tee /tmp/process-types.txt
      - name: Exercise source parity and authoring regression tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_process_planning.py tests/test_process_catalogue.py tests/test_process.py tests/test_lexicon.py tests/test_determinism_hygiene.py | tee /tmp/process-tests.txt
      - name: Compile all industries and verify byte-identical replay
        run: |
          python -m worldloom.process_planning --all --out /tmp/process-plans
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from worldloom.process_planning import replay_plan, export_compilations
          root = Path('/tmp/process-plans')
          replay = Path('/tmp/process-replay')
          plans = [replay_plan(p) for p in sorted(root.glob('*.plan.json'))]
          manifest = export_compilations(plans, replay)
          assert len(plans) == 12
          assert manifest['activity_instances'] == 6975
          assert sum(len(p.coverage) for p in plans) == 216
          assert sum(c.status == 'missing' for p in plans for c in p.coverage) == 1
          assert sum(bool(c.calibration_requested) for p in plans for c in p.coverage) == 63
          assert not any(c.calibration_applied for p in plans for c in p.coverage)
          assert sum(p.summary['candidate_template_pairs'] for p in plans) == 55800
          def hashes(directory):
              return {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in directory.iterdir() if p.is_file()}
          assert hashes(root) == hashes(replay), 'replay output differs'
          result = {'industries': 12, 'activity_instances': 6975, 'defined_industry_stream_cells': 215, 'missing_streams': 1, 'calibration_requested_cells': 63, 'calibration_applied_cells': 0, 'candidate_template_pairs': 55800, 'executable_evals': 0, 'byte_identical_replay': True}
          Path('/tmp/process-verification.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Check installed wheel resources and entry point
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/process-wheel .
          python -m pip install --no-deps --target /tmp/process-installed /tmp/process-wheel/worldloom-*.whl
          cd /tmp
          PYTHONPATH=/tmp/process-installed python - <<'PY'
          import worldloom
          from worldloom.process_planning import compile_company, default_company, load_catalogue, to_lexicon
          from worldloom.process_catalogue import verify_defaults
          assert worldloom.__file__.startswith('/tmp/process-installed/')
          assert len(load_catalogue().industry_overlays) == 12
          plan = compile_company(default_company('retail'))
          assert len(plan.activities) == 362
          assert len(to_lexicon(plan)) == 146
          assert verify_defaults()['ok']
          print('Installed wheel: both reference importer and planning compiler pass; bundled resources and lexicon integration pass.')
          PY
          PYTHONPATH=/tmp/process-installed python -m worldloom.process_planning --industry banking --out /tmp/wheel-banking
      - name: Commit validated integration
        run: |
          git config user.name 'worldloom-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -r .github/process-catalogue-transfer
          git rm .github/workflows/process-catalogue-integrate.yml
          git add src/worldloom/process_planning src/worldloom/_data/processes src/worldloom/process.py tools/compile_process_plans.py tools/import_process_plans.py tests/test_process_planning.py docs/process-catalogue.md docs/design/vocabulary-input.md docs/README.md CHANGELOG.md .claude/skills/worldloom-process-catalogue/SKILL.md
          git diff --cached --check
          git commit -m 'Integrate supplied twelve-industry process planning with replay and evidence boundaries'
          git push origin HEAD:codex/worldloom-artifact-realism
          git rev-parse HEAD | tee /tmp/process-integration-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-catalogue-verification
          path: |
            /tmp/process-plans
            /tmp/process-lint.txt
            /tmp/process-types.txt
            /tmp/process-tests.txt
            /tmp/process-verification.json
            /tmp/process-integration-commit.txt
          retention-days: 14
