name: add pptx ecology density
on:
  push:
    branches: [codex/worldloom-artifact-realism]
    paths: [.github/workflows/artifact-realism-pptx-density.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/worldloom-artifact-realism
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Feed ecology density into component planning
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worldloom/render/pptx.py')
          text = path.read_text()
          old = '''_SIZE_CLASS = "small"\n_DENSITY_PROFILE = "balanced"\n\n\ndef _plan(ir: ArtifactIR,\n'''
          new = '''_SIZE_CLASS = "small"\n_DENSITY_PROFILE = "balanced"\n\n\ndef _density_profile(ir: ArtifactIR) -> str:\n    """Translate ecology's visual density into the semantic compiler axis.\n\n    Legacy IR has no ecology metadata and remains balanced byte-for-byte. The\n    mapping changes component selection, not facts: compact decks can reach\n    metric/table components whose density bands correctly exclude sparse prose.\n    """\n    return {\n        "airy": "sparse",\n        "balanced": "balanced",\n        "compact": "dense",\n    }.get(ir.metadata.get("artifact_density", ""), _DENSITY_PROFILE)\n\n\ndef _plan(ir: ArtifactIR,\n'''
          if old not in text:
              raise SystemExit('pptx density seam changed')
          text = text.replace(old, new, 1)
          old_call = '        density_profile=_DENSITY_PROFILE,\n'
          new_call = '        density_profile=_density_profile(ir),\n'
          if text.count(old_call) != 1:
              raise SystemExit('pptx plan call seam changed')
          path.write_text(text.replace(old_call, new_call, 1))
          PY
      - run: |
          python -m pip install -e '.[dev]' ruff==0.15.8
          ruff check src/worldloom/render/pptx.py tests/test_artifact_ecology_rendering.py
          pytest -q tests/test_artifact_ecology_rendering.py tests/test_render.py
      - name: Commit only PPTX behavior
        run: |
          git config user.name 'worldloom-artifact-realism'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worldloom/render/pptx.py
          git commit -m 'Let artifact ecology drive PPTX density'
          git push origin HEAD:codex/worldloom-artifact-realism
