<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 240" width="1250" height="240" role="img">
<rect width="1250" height="240" fill="#F7F7F5"/>
<rect x="50" y="70" width="250" height="96" rx="2" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="1"/>
<text x="66" y="98" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#6E6E6A" text-anchor="start" letter-spacing="0.14em">PLAN</text>
<text x="66" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start">spaces --cover</text>
<text x="66" y="146" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6E6E6A" text-anchor="start">39 rows cover every pair of 11,197,440</text>
<line x1="306" y1="118.0" x2="337" y2="118.0" stroke="#6E6E6A" stroke-width="1.2"/><path d="M 344 118.0 l -8 -4 l 0 8 z" fill="#6E6E6A"/>
<rect x="350" y="70" width="250" height="96" rx="2" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="1"/>
<text x="366" y="98" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#6E6E6A" text-anchor="start" letter-spacing="0.14em">BUILD</text>
<text x="366" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start">build / mosaic / evolve</text>
<text x="366" y="146" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6E6E6A" text-anchor="start">into the plan, deterministically</text>
<line x1="606" y1="118.0" x2="637" y2="118.0" stroke="#6E6E6A" stroke-width="1.2"/><path d="M 644 118.0 l -8 -4 l 0 8 z" fill="#6E6E6A"/>
<rect x="650" y="70" width="250" height="96" rx="2" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="1"/>
<text x="666" y="98" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#6E6E6A" text-anchor="start" letter-spacing="0.14em">MEASURE</text>
<text x="666" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start">diversity --effective</text>
<text x="666" y="146" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6E6E6A" text-anchor="start">the effective number, not the count</text>
<line x1="906" y1="118.0" x2="937" y2="118.0" stroke="#6E6E6A" stroke-width="1.2"/><path d="M 944 118.0 l -8 -4 l 0 8 z" fill="#6E6E6A"/>
<rect x="950" y="70" width="250" height="96" rx="2" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="1"/>
<text x="966" y="98" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#6E6E6A" text-anchor="start" letter-spacing="0.14em">ASK</text>
<text x="966" y="124" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="500" fill="#1A1A1A" text-anchor="start">spaces --holes</text>
<text x="966" y="146" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#6E6E6A" text-anchor="start">which combinations still do not exist</text>
<path d="M 1075 166 L 1075 218 L 175 218 L 175 172" fill="none" stroke="#E85D1F" stroke-width="1.5"/>
<path d="M 175 168 l -5 9 l 10 0 z" fill="#E85D1F"/>
<text x="625" y="210" font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#E85D1F" text-anchor="middle">plan again, against the answer — both readings report a denominator</text>
</svg>
